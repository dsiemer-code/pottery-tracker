      </div>`, (el) => {
      el.querySelector("#sh-back").addEventListener("click", peopleSheet);
      el.querySelector("#sh-sign").addEventListener("click", signView);
      el.querySelector("#sh-copy").addEventListener("click", async () => {
        try { await navigator.clipboard.writeText(appLink()); toast("Link copied", "ok"); } catch (e) { toast("Couldn't copy. Press and hold the link to copy it instead.", "warn"); }
      });
    });
  }
  function peopleSheet() {
    if (!fs) {
      openSheet(`<div class="pp-head"><h3>People</h3><button class="btn ghost small" type="button" id="pp-share">Share the app</button></div><p class="hint">In demo mode there's nobody to add. Once Firebase is connected, this is where people get logins: full access, or students who can look but not change anything.</p>
        <div class="actions"><div class="right"><button class="btn" type="button" id="pp-close">Close</button></div></div>`, (el) => { el.querySelector("#pp-close").addEventListener("click", closeSheet); el.querySelector("#pp-share").addEventListener("click", shareSheet); });
      return;
    }
    openSheet(`
      <div class="pp-head"><h3>People</h3><button class="btn ghost small" type="button" id="pp-share">Share the app</button></div>
      <div id="pp-wait"></div>
      <div id="pp-fix"></div>
      <div class="sect-label">Who can sign in</div>
      <div id="pp-list" class="pp-list"></div>
      <form id="pp-add" class="pp-add" novalidate>
        <div class="sect-label">Add someone</div>
        <div class="fgrid">
          <label class="f">Full name<input id="pp-name" placeholder="e.g. Sarah Jones" ${TEXT_ATTRS} autocapitalize="words"></label>
          <label class="f">Display name<input id="pp-short" placeholder="e.g. Sarah" ${TEXT_ATTRS} autocapitalize="words"></label>
          <label class="f">Email<input id="pp-email" type="email" inputmode="email" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="sarah@example.com"></label>
          <label class="f">Starting password<input id="pp-pass" autocomplete="new-password" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="At least 6 characters"></label>
          <div class="f"><span>Access</span>${pillSet("pp-role", ROLES, ["full"], { single: true, label: "Access" })}</div>
          <p class="hint full">Full access can add and change everything, including people. Admin is the same, but hidden from People and from the artist and owner lists. Students can look at everything but can't change anything.</p>
          <label class="pp-own full"><input type="checkbox" id="pp-owner"> Glaze owner: they have glazes of their own to list</label>
          <div class="full"><button class="btn" type="submit" id="pp-go">Add person</button></div>
          <div class="full" id="pp-done"></div>
        </div>
      </form>
      <div class="actions"><div class="right"><button class="btn ghost" type="button" id="pp-close">Close</button></div></div>`, (el) => {
      el.classList.add("people");
      refreshPeople();
      wireForm(el);
      el.querySelector("#pp-close").addEventListener("click", closeSheet);
      el.querySelector("#pp-share").addEventListener("click", shareSheet);
      el.addEventListener("change", async (e) => {
        const ow = e.target.closest("[data-owner]");
        if (ow) {
          try { await updateDoc(memberRef(ow.dataset.owner), { owner: ow.checked }); toast(ow.checked ? "They can be picked as a glaze owner now" : "Not a glaze owner anymore", "ok"); }
          catch (ex) { console.error(ex); toast("Couldn't change that. Try again.", "err"); refreshPeople(); }
          return;
        }
        const s = e.target.closest("[data-role]"); if (!s) return;
        try { await updateDoc(memberRef(s.dataset.role), { role: s.value === "student" ? "student" : "full", hidden: s.value === "admin" }); toast(s.value === "student" ? "Changed to student (view only)" : s.value === "admin" ? "Changed to admin (hidden from lists)" : "Changed to full access", "ok"); }
        catch (ex) { console.error(ex); toast("Couldn't change that. Try again.", "err"); refreshPeople(); }
      });
      el.addEventListener("click", async (e) => {
        const fx = e.target.closest("[data-fix]");
        if (fx) {
          const from = fx.dataset.fix, to = el.querySelector(`[data-fix-to="${CSS.escape(from)}"]`).value;
          const m = state.members.find((x) => personName(x) === to); if (!to || !m) return;
          fx.disabled = true;
          try {
            for (const g of state.glazes.filter((x) => (x.owners || []).includes(from))) { const { id, ...data } = g; await api.save("glazes", id, { ...data, owners: [...new Set(g.owners.map((o) => (o === from ? to : o)))] }); }
            if (fs && !m.owner && m.id !== (state.me && state.me.uid)) await updateDoc(memberRef(m.id), { owner: true }).catch(console.error);
            refreshPeople(); toast(`Changed “${from}” to ${to}`, "ok");
          } catch (ex) { console.error(ex); toast("Couldn't change that. Try again.", "err"); fx.disabled = false; }
          return;
        }
        const rn = e.target.closest("[data-rename]");
        if (rn) { const m = state.members.find((x) => x.id === rn.dataset.rename); if (m) personNameSheet(m); return; }
        const let_ = e.target.closest("[data-let]"), no = e.target.closest("[data-decline]");
        if (let_) {
          const r = state.requests.find((x) => x.id === let_.dataset.let); if (!r) return;
          let_.disabled = true;
          try {
            const b = writeBatch(fs);
            const name = (r.name || "").trim(), short = name ? suggestShort(name, r.id) : "";
            b.set(memberRef(r.id), { email: r.email || "", name, ...(short ? { short } : {}), role: let_.dataset.as, createdAt: Date.now() });
            b.delete(requestRef(r.id));
            await b.commit();
            toast(`${short || r.email || "They"} can get in now${let_.dataset.as === "student" ? " as a student" : ""}`, "ok");
          } catch (ex) { console.error(ex); toast("Couldn't let them in. Try again.", "err"); let_.disabled = false; }
        }
        if (no) { try { await deleteDoc(requestRef(no.dataset.decline)); toast("Request removed", "ok"); } catch (ex) { console.error(ex); toast("Couldn't remove that. Try again.", "err"); } }
        const cp = e.target.closest("[data-copy]");
        if (cp) {
          try { await navigator.clipboard.writeText(cp.dataset.copy); toast("Copied. Paste it into a text to them.", "ok"); }
          catch (ex) { toast("Couldn't copy. Write the email and password down instead.", "warn"); }
        }
      });
      // The display name fills itself in from the full name (first name, or first name + last initial if taken) until she types her own
      const shortIn = el.querySelector("#pp-short");
      shortIn.addEventListener("input", () => (shortIn.dataset.touched = "1"));
      el.querySelector("#pp-name").addEventListener("input", (e) => { if (!shortIn.dataset.touched) shortIn.value = suggestShort(e.target.value); });
      el.querySelector("#pp-add").addEventListener("submit", async (e) => {
        e.preventDefault();
        const name = el.querySelector("#pp-name").value.trim(), email = el.querySelector("#pp-email").value.trim().toLowerCase(), pass = el.querySelector("#pp-pass").value;
        const short = el.querySelector("#pp-short").value.trim() || suggestShort(name) || email.split("@")[0];
        if (nameTaken(short)) { el.querySelector("#pp-short").focus(); return toast(`Someone already shows as “${short}”. Add a last initial, like “${short} H”.`, "warn"); }
        const role = readPills(el, "pp-role")[0] || "full";
        if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { el.querySelector("#pp-email").focus(); return toast("Type their email address.", "warn"); }
        if (pass.length < 6) { el.querySelector("#pp-pass").focus(); return toast("The password needs at least 6 characters.", "warn"); }
        const go = el.querySelector("#pp-go"); go.disabled = true; go.textContent = "Adding…";
        try {
          const adder = getAdder();
          const cred = await createUserWithEmailAndPassword(adder, email, pass);
          const uid = cred.user.uid;
          await signOut(adder);
          await setDoc(memberRef(uid), { email, name, short, role: role === "student" ? "student" : "full", hidden: role === "admin", owner: el.querySelector("#pp-owner").checked, createdAt: Date.now() });
          const details = `Pottery Tracker\n${appLink()}\nEmail: ${email}\nPassword: ${pass}`;
          el.querySelector("#pp-done").innerHTML = `<div class="pp-card"><b>${esc(name || email)} can sign in now${role === "student" ? " (view only)" : ""}.</b>
            <span>Send them the link, their email and this password: <b>${esc(pass)}</b></span>
            <button type="button" class="btn small" data-copy="${esc(details)}">Copy sign-in details</button></div>`;
          ["#pp-name", "#pp-short", "#pp-email", "#pp-pass"].forEach((s) => (el.querySelector(s).value = "")); delete el.querySelector("#pp-short").dataset.touched; el.querySelector("#pp-owner").checked = false;
          toast(`${name || email} added`, "ok");
        } catch (ex) {
          console.error(ex);
          const c = (ex && ex.code) || "";
          toast(c.includes("email-already-in-use") ? "That email already has a login. Have them open the app and sign in; they'll show up here under “Waiting to get in”." :
            c.includes("invalid-email") ? "That email doesn't look right." :
            c.includes("weak-password") ? "Pick a longer password." :
            c.includes("operation-not-allowed") || c.includes("admin-restricted") ? "Firebase isn't allowing new logins yet. Turn on “Enable create (sign-up)” in Firebase (see the setup guide)." :
            c.includes("network") ? "No connection. Try again when you're online." :
            c.includes("permission") ? "This account can't add people." : "Couldn't add them. Try again.", "err");
        }
        go.disabled = false; go.textContent = "Add person";
      });
    }, { big: true });
  }

  // Students see everything but can't change it: same popups, with the boxes locked and no Save
  function makeReadOnly(el) {
    el.classList.add("ro");
    el.querySelectorAll("input:not(.vh), select, textarea").forEach((x) => (x.disabled = true));
    const acts = el.querySelector(".actions");
    if (acts) { acts.innerHTML = `<div class="right"><button class="btn" type="button" data-ro-close>Close</button></div>`; acts.querySelector("[data-ro-close]").addEventListener("click", closeSheet); }
    const h = el.querySelector("h3"); if (h) h.textContent = h.textContent.replace(/^Edit (\w)/, (m, c) => c.toUpperCase());
  }

  function waitingHTML() {
    if (state.role === null) return `<section class="panel"><div class="empty">Checking your access…</div></section>`;
    return `<section class="panel">
      <h2>${state.me && state.me.name ? `Thanks, ${esc(state.me.name.split(" ")[0])}!` : "Almost there"}</h2>
      <p style="margin:0 0 10px">You're signed in as <b>${esc(state.me ? state.me.email : "")}</b>. Someone at the studio needs to let you in before you can see the app.</p>
      <p style="margin:0;color:var(--muted)">Ask at the studio. Once they let you in, this page opens the app by itself.</p>
      ${state.accessError ? `<p style="margin:10px 0 0;color:var(--danger)">Couldn't check your access. Make sure you're online, then close and reopen the app.</p>` : ""}
    </section>`;
  }

  // ---------- Sheets ----------
  function openSheet(html, onMount, { big = false, ro = false } = {}) {
    const root = document.getElementById("sheet-root");
    root.innerHTML = `<div class="overlay" id="overlay"><div class="sheet${big ? " big" : ""}" role="dialog" aria-modal="true">${html}</div></div>`;
    const ov = document.getElementById("overlay");
    ov.addEventListener("click", (e) => { if (e.target === ov) closeSheet(); });
    onMount && onMount(root.querySelector(".sheet"));
    if (ro) makeReadOnly(root.querySelector(".sheet"));
    // Only jump into the first box with a mouse and keyboard; on a phone or iPad the keyboard would cover the popup
    const first = root.querySelector("input:not(.vh), textarea"); if (first && matchMedia("(pointer: fine)").matches) first.focus();
  }
  function closeSheet() { document.getElementById("sheet-root").innerHTML = ""; }
  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape") return;
    const crop = document.querySelector(".cropper"); if (crop) { crop.querySelector("[data-c=cancel]").click(); return; }
    const sv = document.querySelector(".signview"); if (sv) { sv.remove(); return; }
    const v = document.querySelector(".viewer"); if (v) { v.remove(); return; }
    const picker = document.querySelector(".picker-ov");
    if (picker) picker.remove(); else closeSheet();
  });

  function armDelete(btn, label, fn) {
    btn.addEventListener("click", async () => {
      if (!btn.classList.contains("armed")) { btn.classList.add("armed"); btn.textContent = "Tap again to delete"; setTimeout(() => { btn.classList.remove("armed"); btn.textContent = label; }, 3500); return; }
      await fn();
    });
  }

  // Full-screen photo, with arrows when there are several. Tap the dark area to close.
  // onCrop(index): when given (in an edit popup), a Crop button closes the viewer and hands back which photo to crop.
  function viewPhotos(photos, start = 0, caption = "", { onCrop } = {}) {
    if (!canEdit()) onCrop = undefined;
    // Keep each photo's original position, since ones still loading ("") are left out
    const list = photos.map((src, k) => ({ src, k })).filter((x) => x.src); if (!list.length) return;
    photos = list.map((x) => x.src);
    let i = Math.max(0, list.findIndex((x) => x.k === start));
    const root = document.createElement("div");
    root.className = "viewer"; root.setAttribute("role", "dialog"); root.setAttribute("aria-modal", "true"); root.setAttribute("aria-label", caption || "Photo");
    const draw = () => {
      root.innerHTML = `<button class="btn small v-close" data-v="close">Close</button><img src="${esc(photos[i])}" alt="${esc(caption)}">
        ${caption ? `<div class="cap">${esc(caption)}</div>` : ""}
        ${photos.length > 1 || onCrop ? `<div class="bar">${photos.length > 1 ? `<button class="btn ghost small" data-v="-1" aria-label="Previous photo">‹</button><span class="num">${i + 1} / ${photos.length}</span><button class="btn ghost small" data-v="1" aria-label="Next photo">›</button>` : ""}
          ${onCrop ? `<button class="btn small v-crop" data-v="crop">Crop</button>` : ""}</div>` : ""}`;
    };
    draw();
    root.addEventListener("click", (e) => {
      const b = e.target.closest("[data-v]");
      if (!b) { if (e.target === root) root.remove(); return; }
      if (b.dataset.v === "close") return root.remove();
      if (b.dataset.v === "crop") { root.remove(); return onCrop(list[i].k); }
      i = (i + Number(b.dataset.v) + photos.length) % photos.length; draw();
    });
    document.body.appendChild(root);
    root.querySelector(".v-close").focus();
  }

  // Searchable glaze list with photos, like a full-size dropdown. onPick(id, typedName): id is a glaze id,
  // "" for All glazes (filter mode) or "new" for a glaze that isn't in the Glazes tab yet.
  function pickGlaze(currentId, onPick, { filter = false, skip = [] } = {}) {
    const all = glazeList().filter((g) => !skip.includes(g.id) || g.id === currentId).sort(glazeSort);
    // Whose glazes to list: Studio's by default; the choice sticks while the app is open
    const owners = [...new Set(all.flatMap(ownersOf))].sort(ownerSort);
    if (state.pickOwner && !owners.includes(state.pickOwner)) state.pickOwner = "";
    const mine = () => all.filter((g) => !state.pickOwner || ownersOf(g).includes(state.pickOwner) || g.id === currentId);
    let glazes = mine();
    const title = filter ? "Show pieces with" : "Choose a glaze";
    const ov = document.createElement("div");
    ov.className = "picker-ov";
    ov.innerHTML = `<div class="picker" role="dialog" aria-modal="true" aria-label="${title}">
      <div class="picker-head"><h3>${title}</h3><button type="button" class="btn ghost small" data-close>Close</button></div>
      <div class="picker-search">${owners.length > 1 ? `<select class="pick-owner" aria-label="Whose glazes">${owners.map((o) => `<option value="${esc(o)}"${state.pickOwner === o ? " selected" : ""}>${o === STUDIO ? "Studio" : esc(o) + "'s"}</option>`).join("")}<option value=""${!state.pickOwner ? " selected" : ""}>Everyone's</option></select>` : ""}<input type="search" placeholder="Search ${plural(glazes.length, "glaze")}" aria-label="Search glazes" ${TEXT_ATTRS} autocapitalize="words"></div>
      <div class="picker-list"></div>
    </div>`;
    document.getElementById("sheet-root").appendChild(ov);
    const list = ov.querySelector(".picker-list"), q = ov.querySelector("input[type=search]");
    const ownSel = ov.querySelector(".pick-owner");
    if (ownSel) ownSel.addEventListener("change", () => { state.pickOwner = ownSel.value; glazes = mine(); q.placeholder = `Search ${plural(glazes.length, "glaze")}`; draw(); });
    const used = (g) => piecesWithGlaze(g.id).length;
    const row = (g) => `<button type="button" class="pick-row" data-id="${esc(g.id)}" aria-selected="${g.id === currentId}">${glazeThumb(g)}
      <span class="nm">${g.code ? `<span class="code">${esc(g.code)}</span> ` : ""}${esc(g.name)}${g.runner ? ` <span class="chip no">Runs</span>` : ""}<span class="meta">${[typeOf(g) === "glaze" ? "" : typeLabel(g.type), g.brand, ratingLabel(g.rating), notJustStudio(g) ? `owned by ${ownersOf(g).join(", ")}` : "", used(g) ? `on ${plural(used(g), "piece")}` : ""].filter(Boolean).map(esc).join(" · ")}</span>${g.description || g.notes ? `<span class="pnote">${esc([g.description, g.notes].filter(Boolean).join(" — "))}</span>` : ""}</span></button>`;
    const allRow = () => `<button type="button" class="pick-row" data-id="" aria-selected="${!currentId}"><span class="gdot" aria-hidden="true">★</span>
      <span class="nm">All glazes<span class="meta">Show every piece</span></span></button>`;
    const newRow = (name) => `<button type="button" class="pick-row" data-id="new" data-name="${esc(name)}"><span class="gdot" aria-hidden="true">+</span>
      <span class="nm">${name ? `Add “${esc(name)}” as a new glaze` : "New glaze (not in Glazes yet)"}<span class="meta">It's added to the Glazes tab when you save the piece</span></span></button>`;
    const draw = () => {
      const typed = q.value.trim(), t = typed.toLowerCase();
      const hits = t ? glazes.filter((g) => [g.name, g.brand, g.color, g.code, ...ownersOf(g)].some((s) => (s || "").toLowerCase().includes(t)) || (g.code && sameCode(g.code, t))) : glazes;
      const exact = glazeList().some((g) => (g.name || "").trim().toLowerCase() === t);
      list.innerHTML = (filter ? (typed ? "" : allRow()) : exact || !canEdit() ? "" : newRow(typed))
        + hits.map(row).join("")
        + (hits.length ? "" : `<p class="pick-none">${typed ? `No glaze matches “${esc(typed)}”` : "No glazes here"}${state.pickOwner ? ` in ${state.pickOwner === STUDIO ? "Studio" : esc(state.pickOwner) + "'s"}. Try “Everyone's” above.` : "."}</p>`);
    };
    draw();
    Promise.all(glazes.filter((g) => g.photoId && !photoCache.has(g.photoId)).map((g) => loadPhoto(g.photoId))).then((got) => { if (got.length && ov.isConnected) draw(); });
    q.addEventListener("input", draw);
    ov.addEventListener("click", (e) => {
      if (e.target === ov || e.target.closest("[data-close]")) return ov.remove();
      const b = e.target.closest(".pick-row"); if (!b) return;
      ov.remove(); onPick(b.dataset.id, b.dataset.name || "");
    });
    const cur = list.querySelector('[aria-selected="true"]'); if (cur) cur.scrollIntoView({ block: "center" });
    if (matchMedia("(pointer: fine)").matches) q.focus();
  }

  // Photo tiles in a popup. Each item is { id, src }: id is the stored photo, "" for one not saved yet.
  function photoTile(ph, i, { cover = false, label = "photo" } = {}) {
    return `<div class="ph">
      ${ph.src ? `<button type="button" class="img" data-ph-view="${i}" aria-label="See ${label} ${i + 1} bigger"><img src="${esc(ph.src)}" alt=""></button>` : `<div class="loading">Loading…</div>`}
      ${cover ? `<span class="cover">Cover</span>` : ""}
      <div class="ph-acts">
        ${i > 0 ? `<button type="button" data-ph-cover="${i}" aria-label="Make this the cover photo" title="Make cover">★</button>` : ""}
        ${ph.src ? `<button type="button" data-ph-rot="${i}" aria-label="Rotate ${label} ${i + 1} a quarter turn" title="Rotate">↻</button>` : ""}
        <button type="button" data-ph-rm="${i}" aria-label="Remove ${label} ${i + 1}" title="Remove">×</button>
      </div>
    </div>`;
  }

  // ---------- Form pieces shared by the popups ----------
  const opt = (o, val) => `<option${o === val ? " selected" : ""}>${esc(o)}</option>`;
  // A dropdown with an "Other…" choice that opens a box for typing something that isn't listed
  function choice(id, opts, val, ph, blank = "Not recorded") {
    const custom = !!val && !opts.includes(val);
    return `<select id="${id}" data-choice="${id}-other"><option value="">${blank}</option>${opts.map((o) => opt(o, val)).join("")}<option value="__other"${custom ? " selected" : ""}>Other…</option></select>
      <input id="${id}-other"${custom ? "" : " hidden"} value="${custom ? esc(val) : ""}" placeholder="${esc(ph)}" ${TEXT_ATTRS} autocapitalize="sentences" aria-label="Type your own">`;
  }
  const readChoice = (el, id) => { const v = el.querySelector("#" + id).value; return v === "__other" ? el.querySelector(`#${id}-other`).value.trim() : v; };
  // Buttons to tap on and off. opts: strings, or [value, label]. single: only one can be on (tap again to clear).
  function pillSet(id, opts, chosen, { single = false, label = "" } = {}) {
    return `<div class="pills" id="${id}" role="${single ? "radiogroup" : "group"}" aria-label="${esc(label)}"${single ? " data-single" : ""}>${opts.map((o) => {
      const [v, l] = Array.isArray(o) ? o : [o, o];
      return `<button type="button" role="${single ? "radio" : "checkbox"}" data-v="${esc(v)}" aria-checked="${chosen.includes(v)}">${esc(l)}</button>`;
    }).join("")}</div>`;
  }
  const readPills = (el, id) => [...el.querySelectorAll(`#${id} [aria-checked="true"]`)].map((b) => b.dataset.v);
  const textIn = (id, label, val, ph, { full = false, attrs = "" } = {}) =>
    `<label class="f${full ? " full" : ""}" ${attrs}>${label}<input id="${id}" value="${esc(val ?? "")}" placeholder="${esc(ph)}" ${TEXT_ATTRS} autocapitalize="sentences"></label>`;
  const numIn = (id, label, val, ph, { full = false, attrs = "", unit = "", pre = "" } = {}) =>
    `<label class="f${full ? " full" : ""}" ${attrs}>${label}<input id="${id}" inputmode="decimal" value="${esc(val ?? "")}" placeholder="${esc(ph)}" autocomplete="off" data-unit="${unit}" data-pre="${pre}"></label>`;
  // A section that starts closed; when closed it shows a one-line summary of what's filled in
  const sect = (key, title, body, { last = false } = {}) =>
    `<details class="sect" data-sect="${key}"${last ? " data-last" : ""}><summary><span class="st">${title}</span><span class="sum"></span></summary><div class="fgrid sect-body">${body}</div></details>`;
  function sectSummary(d) {
    const out = [];
    d.querySelectorAll(".sect-body input, .sect-body select, .sect-body textarea, .sect-body [aria-checked='true'], .sect-body .pick-btn .nm:not(.placeholder)").forEach((x) => {
      if (x.closest("[hidden]") || x.classList.contains("vh") || x.type === "file") return;
      if (x.matches("[aria-checked], .nm")) return out.push(x.textContent.trim());
      if (x.closest(".gline")) return; // a glaze's coats and notes; its name is enough here
      const v = (x.value || "").trim(); if (!v || v.startsWith("__")) return;
      if (x.tagName === "SELECT") return out.push(x.selectedOptions[0].textContent.trim());
      if (x.type === "date") { const lab = x.closest("label"); return out.push(`${lab ? lab.firstChild.textContent.trim() : ""} ${dateLabel(v)}`); }
      if (x.tagName === "TEXTAREA") return out.push(v.length > 50 ? v.slice(0, 50) + "…" : v);
      out.push((x.dataset.pre || "") + v + (x.dataset.unit || ""));
    });
    return (d.hasAttribute("data-last") ? out.slice(-1) : out).join(d.dataset.sect === "price" ? " – " : " · ");
  }
  // Pills, "Other…" boxes and section summaries, for any popup form
  function wireForm(el) {
    let queued = 0;
    const refresh = () => { if (queued) return; queued = requestAnimationFrame(() => { queued = 0; el.querySelectorAll("details.sect").forEach((d) => { d.querySelector(".sum").textContent = sectSummary(d); }); }); };
    el.addEventListener("click", (e) => {
      const b = !el.classList.contains("ro") && e.target.closest(".pills [data-v]");
      if (b) {
        const set = b.parentElement, on = b.getAttribute("aria-checked") !== "true";
        if (set.hasAttribute("data-single")) set.querySelectorAll("[data-v]").forEach((x) => x.setAttribute("aria-checked", "false"));
        b.setAttribute("aria-checked", String(on));
      }
      refresh();
    });
    el.addEventListener("change", (e) => {
      const s = e.target.closest("select[data-choice]");
      if (s) { const other = el.querySelector("#" + s.dataset.choice); other.hidden = s.value !== "__other"; if (!other.hidden) other.focus(); }
      refresh();
    });
    el.addEventListener("input", refresh);
    refresh();
  }
  function onePhoto(box, get, set, { label = "photo", addText = "Add photo", fileInput, caption = () => "" }) {
    const show = () => { const ph = get(); box.innerHTML = ph ? photoTile(ph, 0, { label }) : `<button type="button" class="ph-add" data-add><b>+</b>${addText}</button>`; };
    show();
    const ph0 = get();
    if (ph0 && !ph0.src) loadPhoto(ph0.id).then((src) => { const ph = get(); if (src && ph && !ph.src) { ph.src = src; show(); } });
    box.addEventListener("click", async (e) => {
      if (e.target.closest("[data-add]")) return fileInput.click();
      if (e.target.closest("[data-ph-view]")) return viewPhotos([get().src], 0, caption(), { onCrop: async () => { const out = await cropPhoto(get().src); if (out) { set({ id: "", src: out }); show(); } } });
      if (e.target.closest("[data-ph-rm]")) { set(null); return show(); }
      const rot = e.target.closest("[data-ph-rot]"); if (!rot) return;
      rot.disabled = true;
      try { set({ id: "", src: await rotatePhoto(get().src) }); } catch (ex) { console.error(ex); toast("Couldn't turn that photo.", "err"); }
      show();
    });
    fileInput.addEventListener("change", async (e) => {
      const f = e.target.files && e.target.files[0]; e.target.value = "";
      if (!f) return;
      box.innerHTML = `<div class="ph"><div class="loading">Loading…</div></div>`;
      try { const src = await addPhoto(f); if (src) set({ id: "", src }); } catch (ex) { console.error(ex); toast("Couldn't open that photo. Try a JPG or PNG.", "err"); }
      show();
    });
    return show;
  }

  // ---------- Looking at a piece or glaze (everyone) ----------
  // Shows only what's filled in, laid out to read, not as a form. Full access gets an Edit button that opens the form.
  const vRow = (label, val) => (val ? `<dt>${label}</dt><dd>${esc(val)}</dd>` : "");
  const vSect = (title, inner) => (inner.trim() ? `<section class="vsect"><h4>${title}</h4>${inner}</section>` : "");
  const vList = (rows) => (rows.trim() ? `<dl class="vlist">${rows}</dl>` : "");
  const vText = (label, val) => (val ? `${label ? `<div class="vlabel">${label}</div>` : ""}<p class="vtext">${esc(val)}</p>` : "");
  const viewActions = (editId, can = canEdit()) => `<div class="actions"><div class="right"><button class="btn ghost" type="button" data-v-close>Close</button>${can ? `<button class="btn" type="button" data-v-edit="${esc(editId)}">Edit</button>` : ""}</div></div>`;
  function wireView(el, onEdit) {
    el.querySelector("[data-v-close]").addEventListener("click", closeSheet);
    const ed = el.querySelector("[data-v-edit]"); if (ed) ed.addEventListener("click", onEdit);
    el.addEventListener("click", (e) => {
      const vg = e.target.closest("[data-view-glaze]"); if (vg) { const g = glazeById(vg.dataset.viewGlaze); if (g) glazeView(g); return; }
      const vp = e.target.closest("[data-view-piece]"); if (vp) { const p = pieceById(vp.dataset.viewPiece); if (p) pieceView(p); }
    });
  }

  function pieceView(p) {
    if (!p) return;
    const ids = piecePhotoIds(p), st = statusOf(p);
    const chips = [st ? `<span class="chip">${esc(st[1])}</span>` : "", ...(p.tags || []).map((t) => `<span class="chip ${t === "favorite" ? "love" : "no"}">${esc(tagLabel(t))}</span>`)].join("");
    const lines = (p.glazes || []).map((l, i) => {
      const g = glazeById(l.glazeId);
      const detail = [l.coats ? `${l.coats} coat${l.coats === "1" ? "" : "s"}` : "", l.method, l.where, l.how].filter(Boolean).join(" · ");
      const inner = `<span class="vnum">${i + 1}</span>${glazeThumb(g)}<span class="vgl"><b>${esc(g ? gLabel(g) : l.name || "Glaze")}</b>${g && g.runner ? ` <span class="chip no">Runs</span>` : ""}${detail ? `<small>${esc(detail)}</small>` : ""}</span>`;
      return g ? `<button type="button" class="vline" data-view-glaze="${esc(g.id)}">${inner}</button>` : `<div class="vline">${inner}</div>`;
    }).join("");
    const clayLine = p.clay ? p.clay + (p.clayKind ? ` (${p.clayKind})` : "") : "";
    openSheet(`
      <div class="vhead"><h3>${esc(p.name)}</h3>
        ${p.artist ? `<div class="vsub">By ${esc(p.artist)}</div>` : ""}
        ${chips ? `<div class="chips">${chips}</div>` : ""}</div>
      ${ids.length ? `<div class="vphotos">${ids.map((id, i) => `<button type="button" data-vph="${i}" aria-label="See photo ${i + 1} bigger"><img data-pid="${esc(id)}" alt="">${id === p.bottomPhotoId ? `<span class="tagb">Bottom</span>` : ""}</button>`).join("")}</div>` : ""}
      ${vSect("About the piece", vList(vRow("Form", p.form) + vRow("Size", p.size) + vRow("Technique", (p.techniques || []).join(", ")) + vRow("Slab", p.slab)))}
      ${vSect("Dates", vList(STAGES.map(([k, label]) => vRow(label, stageDate(p, k) ? dateLabel(stageDate(p, k)) : "")).join("")))}
      ${vSect("Clay", vList(vRow("Clay body", clayLine) + vRow("Clay used", p.clayGrams ? `${p.clayGrams} g` : "") + vRow("Finished weight", p.weight)
        + vRow("Before firing", p.dimBefore) + vRow("After firing", p.dimAfter) + vRow("Holds", p.volumeOz ? `${p.volumeOz} oz` : "")))}
      ${vSect("Glazes and decoration", (lines ? `<div class="vlines">${lines}</div>` : "")
        + vList(vRow("Layering", p.layering) + vRow("Decorations", (p.decor || []).join(", ")) + vRow("Decorative techniques", p.decorTech) + vRow("Tools", p.tools))
        + vText("Description of the glazes", p.glazeNotes))}
      ${vSect("Firing", vList(vRow("Firing type", p.firing) + vRow("Bisque", p.bisqueTemp) + vRow("Glaze firing", p.fireTemp)))}
      ${canEdit() ? vSect("Price range", vList(vRow("Price", priceRange(p)))) : ""}
      ${vSect("Comments", vText("", p.notes))}
      ${viewActions(p.id, canEditPiece(p))}`, (el) => {
      el.classList.add("view");
      wireView(el, () => pieceSheet(p));
      el.querySelectorAll("img[data-pid]").forEach(async (img) => { const src = await loadPhoto(img.dataset.pid); if (src) img.src = src; });
      el.querySelectorAll("[data-vph]").forEach((b) => b.addEventListener("click", async () => {
        viewPhotos(await Promise.all(ids.map(loadPhoto)), Number(b.dataset.vph), p.name);
      }));
    }, { big: true });
  }

  function glazeView(g) {
    if (!g) return;
    const clay = isClay(g), usedOn = (clay ? piecesWithClay(g.name) : piecesWithGlaze(g.id)).sort(pieceSort);
    const chips = [typeOf(g) === "glaze" ? "" : `<span class="chip">${esc(typeLabel(g.type))}</span>`, g.rating ? `<span class="chip ${g.rating}">${esc(ratingLabel(g.rating))}</span>` : "",
      g.runner ? `<span class="chip no">Runs</span>` : ""].join("");
    openSheet(`
      <div class="vhead"><h3>${g.code ? `<span class="code">${esc(g.code)}</span> ` : ""}${esc(g.name)}</h3>
        ${chips.trim() ? `<div class="chips">${chips}</div>` : ""}</div>
      ${g.photoId ? `<div class="vphotos one"><button type="button" data-vph="0" aria-label="See the photo bigger"><img data-pid="${esc(g.photoId)}" alt=""></button></div>` : ""}
      ${vSect("Who has it", `<p class="vtext">${esc(ownersOf(g).join(", "))}</p>`)}
      ${vSect("Buying", vList(vRow("Made by", g.brand) + vRow("Size", g.size) + (canEdit() ? vRow("Price", g.price ? `$${g.price}` : "") : "") + vRow("Where to buy", g.where)))}
      ${vSect(clay ? "Firing" : "Color and firing", vList(vRow("Color", g.color) + vRow("Fire temp", g.cone) + vRow("Bisque", g.bisque) + vRow("Clay it works on", g.clayType)
        + vRow("Shrinkage", g.shrinkage ? `${g.shrinkage}%` : "")))}
      ${vSect("Notes", vText("Description", g.description) + vText("Recipe", g.recipe) + vText(g.description || g.recipe ? "Notes" : "", g.notes))}
      ${usedOn.length ? vSect(`Used on ${plural(usedOn.length, "piece")}`, `<div class="gchips">${usedOn.map((p) => {
        const src = photoSrc(pieceIds(p)[0]);
        return `<button type="button" class="gchip" data-view-piece="${esc(p.id)}">${src ? `<img src="${esc(src)}" alt="">` : `<span class="dot"></span>`}<span>${esc(p.name)}</span></button>`;
      }).join("")}</div>`) : ""}
      ${viewActions(g.id)}`, (el) => {
      el.classList.add("view");
      wireView(el, () => glazeSheet(g));
      el.querySelectorAll("img[data-pid]").forEach(async (img) => { const src = await loadPhoto(img.dataset.pid); if (src) img.src = src; });
      const ph = el.querySelector("[data-vph]"); if (ph) ph.addEventListener("click", async () => viewPhotos([await loadPhoto(g.photoId)], 0, g.name));
    }, { big: true });
  }

  function pieceSheet(p, { student = false } = {}) {
    const isNew = !p;
    p = p || { name: "", date: "", clay: "", glazes: [], notes: "", ...(student ? { student: true, by: myUid() } : {}) };
    const mine = !canEdit(); // a student working on their own piece: their name is the artist, no new glazes or clays
    let photos = pieceIds(p).map((id) => ({ id, src: photoCache.get(id) || "" }));
    let bottom = p.bottomPhotoId ? { id: p.bottomPhotoId, src: photoCache.get(p.bottomPhotoId) || "" } : null;
    // Each line is { glazeId, name, coats, method, where, how }, in the order they went on; glazeId "new" = typing a new glaze
    let lines = (p.glazes || []).map((l) => ({ ...l }));
    const clayList = clays();
    const artistList = artistNames();
    if (isNew && !p.artist && myName()) p = { ...p, artist: myName() };
    if (p.clay && !clayList.includes(p.clay)) clayList.push(p.clay);
    const dateIn = ([k, label]) => `<label class="f">${label}<input type="date" id="p-st-${k}" value="${esc(stageDate(p, k))}"></label>`;

    openSheet(`
      <h3>${isNew ? (p.student ? (mine ? "Add my piece" : "Add a student piece") : "Add a piece") : "Edit piece"}</h3>
      <form id="pform" novalidate>
        <div class="fgrid">
          <div class="full">
            <div class="sect-label">Photos</div>
            <div class="photos" id="p-photos"></div>
            <p class="hint" id="p-photo-hint" style="margin-top:6px"></p>
            <input class="vh" type="file" id="p-file" accept="image/*" multiple tabindex="-1" aria-hidden="true">
          </div>
          <div class="full photo-one">
            <div id="p-bottom"></div>
            <p class="hint">The bottom of the piece: the foot, your mark, the bare clay.</p>
            <input class="vh" type="file" id="p-bfile" accept="image/*" tabindex="-1" aria-hidden="true">
          </div>
          <label class="f full">Piece<input id="p-title" required value="${esc(p.name)}" placeholder="e.g. Blue serving bowl" ${TEXT_ATTRS} autocapitalize="sentences"></label>
        </div>
        <div class="sects">
          ${sect("about", "About the piece", `
            ${mine ? "" : `<label class="f full">Artist (who made it)${choice("p-artist", artistList, p.artist || "", "Their name")}</label>`}
            <label class="f">Form${choice("p-form", FORMS, p.form || "", "e.g. Butter dish")}</label>
            <div class="f"><span>Size</span>${pillSet("p-size", SIZES, [p.size || ""], { single: true, label: "Size" })}</div>
            <div class="f full"><span>Technique</span>${pillSet("p-tech", TECHNIQUES, p.techniques || [], { label: "Technique" })}</div>
            ${textIn("p-slab", "Slab thickness / size", p.slab, "If slab built, e.g. 1/4 inch", { full: true })}
            <div class="f full"><span>Mark this piece as</span>${pillSet("p-tags", TAGS, p.tags || [], { label: "Mark this piece as" })}</div>`)}
          ${sect("status", "Status and dates", `${STAGES.map(dateIn).join("")}
            <p class="hint full">Fill in each date as the piece gets there. The latest one is its status.</p>`, { last: true })}
          ${sect("clay", "Clay", `
            <label class="f">Clay body<select id="p-clay">
              <option value="">Not recorded</option>
              ${clayList.map((c) => opt(c, p.clay)).join("")}
              ${mine ? "" : `<option value="__new">+ New clay…</option>`}
            </select></label>
            <div class="f"><span>New or recycled?</span>${pillSet("p-clay-kind", [["new", "New"], ["recycled", "Recycled"]], [p.clayKind || ""], { single: true, label: "New or recycled clay" })}</div>
            <label class="f full" id="p-clay-new-wrap" hidden>What's the new clay called?<input id="p-clay-new" placeholder="e.g. Speckled Buff" ${TEXT_ATTRS} autocapitalize="words"></label>
            ${numIn("p-grams", "Clay used (grams)", p.clayGrams, "e.g. 450", { unit: " g" })}
            ${textIn("p-weight", "Finished weight", p.weight, "e.g. 1 lb 2 oz")}
            ${textIn("p-dim-before", "Size before firing (L × W × H)", p.dimBefore, "e.g. 5 × 7 × 7 in", { full: true })}
            ${textIn("p-dim-after", "Size after firing (L × W × H)", p.dimAfter, "e.g. 4 5/8 × 6 3/8 × 6 3/8 in", { full: true })}
            ${numIn("p-volume", "Holds (ounces)", p.volumeOz, "e.g. 12", { unit: " oz" })}`)}
          ${sect("glaze", "Glazes and decoration", `
            <div class="full">
              <div class="sect-label">Glazes, in the order they went on</div>
              <div id="p-lines"></div>
              <button class="btn ghost small" type="button" id="p-add-line">+ Add a glaze</button>
            </div>
            <label class="f full">Layering technique${choice("p-layering", LAYERING, p.layering || "", "e.g. Dip, then pour over the rim")}</label>
            <label class="f full">Description of the glazes<textarea id="p-gnotes" rows="3" placeholder="How they look together, where they overlap or break" ${TEXT_ATTRS} autocapitalize="sentences">${esc(p.glazeNotes)}</textarea></label>
            <div class="f full"><span>Decorations</span>${pillSet("p-decor", DECOR, p.decor || [], { label: "Decorations" })}</div>
            ${textIn("p-dtech", "Decorative techniques", p.decorTech, "e.g. Carved leaves, wax resist on the rim", { full: true })}
            ${textIn("p-tools", "Tools used", p.tools, "e.g. Rib, loop tool, stamps", { full: true })}`)}
          ${sect("firing", "Firing", `
            <label class="f full">Firing type${choice("p-firing", FIRINGS, p.firing || "", "e.g. Pit fired")}</label>
            ${textIn("p-bisque", "Bisque temp / cone", p.bisqueTemp, "e.g. Cone 04")}
            ${textIn("p-gfire", "Glaze firing temp / cone", p.fireTemp, "e.g. Cone 6")}`)}
          ${canEdit() ? sect("price", "Price range", `
            ${numIn("p-price-lo", "Low ($)", p.priceLow, "e.g. 20", { pre: "$" })}
            ${numIn("p-price-hi", "High ($)", p.priceHigh, "e.g. 30", { pre: "$" })}`) : ""}
          ${sect("notes", "My comments", `
            <label class="f full">About this piece<textarea id="p-notes" rows="5" placeholder="How it turned out, what worked, what to try next time" ${TEXT_ATTRS} autocapitalize="sentences">${esc(p.notes)}</textarea></label>`)}
        </div>
      </form>
      <div class="actions">
        ${isNew ? "" : `<button class="btn danger" id="p-del" type="button">Delete</button>`}
        <div class="right"><button class="btn ghost" type="button" id="p-cancel">Cancel</button><button class="btn" type="submit" form="pform" id="p-save">${isNew ? "Add piece" : "Save"}</button></div>
      </div>`, (el) => {
      const box = el.querySelector("#p-photos");
      const showPhotos = () => {
        box.innerHTML = photos.map((ph, i) => photoTile(ph, i, { cover: i === 0 && photos.length > 1 })).join("")
          + (photos.length < MAX_PHOTOS ? `<button type="button" class="ph-add" id="p-photo-add"><b>+</b>${photos.length ? "Add photo" : "Add photos"}</button>` : "");
        el.querySelector("#p-photo-hint").textContent = photos.length > 1 ? "The cover shows first on the card. ★ makes a photo the cover, ↻ turns it. Tap a photo to crop it." : photos.length ? "↻ turns a photo that came in sideways. Tap it to crop it." : "";
      };
      showPhotos();
      // Photos already saved may not be on this device yet
      photos.forEach((ph) => { if (!ph.src) loadPhoto(ph.id).then((src) => { if (src) { ph.src = src; if (box.isConnected) showPhotos(); } }); });
      box.addEventListener("click", async (e) => {
        if (e.target.closest("#p-photo-add")) return el.querySelector("#p-file").click();
        const b = e.target.closest("[data-ph-view],[data-ph-rm],[data-ph-rot],[data-ph-cover]"); if (!b) return;
        const { phView, phRm, phRot, phCover } = b.dataset;
        if (phView !== undefined) return viewPhotos(photos.map((x) => x.src), Number(phView), el.querySelector("#p-title").value.trim(), {
          // A re-cropped photo is saved as a new one (the old one is removed on save), like a rotated one
          onCrop: async (k) => { const ph = photos[k]; const out = ph && await cropPhoto(ph.src); if (out) { ph.src = out; ph.id = ""; showPhotos(); } },
        });
        if (phRm !== undefined) { photos.splice(Number(phRm), 1); return showPhotos(); }
        if (phCover !== undefined) { photos.unshift(photos.splice(Number(phCover), 1)[0]); showPhotos(); return toast("That photo is now the cover"); }
        const ph = photos[Number(phRot)]; b.disabled = true;
        try { ph.src = await rotatePhoto(ph.src); ph.id = ""; } catch (ex) { console.error(ex); toast("Couldn't turn that photo.", "err"); }
        showPhotos();
      });
      el.querySelector("#p-file").addEventListener("change", async (e) => {
        const files = [...(e.target.files || [])]; e.target.value = "";
        const room = MAX_PHOTOS - photos.length;
        if (files.length > room) toast(`Up to ${MAX_PHOTOS} photos per piece; added the first ${room}.`, "warn");
        const add = el.querySelector("#p-photo-add"); if (add) { add.disabled = true; add.lastChild.textContent = "Loading…"; }
        const take = files.slice(0, room);
        for (const [n, f] of take.entries()) {
          try { const src = await addPhoto(f, take.length > 1 ? `Photo ${n + 1} of ${take.length}` : "Crop the photo"); if (src) photos.push({ id: "", src }); }
          catch (ex) { console.error(ex); toast("Couldn't open that photo. Try a JPG or PNG.", "err"); }
        }
        showPhotos();
      });
      onePhoto(el.querySelector("#p-bottom"), () => bottom, (v) => { bottom = v; },
        { label: "bottom photo", addText: "Bottom photo", fileInput: el.querySelector("#p-bfile"), caption: () => `${el.querySelector("#p-title").value.trim()} (bottom)` });

      const clayNew = el.querySelector("#p-clay-new-wrap");
      el.querySelector("#p-clay").addEventListener("change", (e) => {
        clayNew.hidden = e.target.value !== "__new";
        if (!clayNew.hidden) el.querySelector("#p-clay-new").focus();
      });

      // Glaze lines: numbered in order; a button with the glaze's photo opens the glaze list
      const linesBox = el.querySelector("#p-lines");
      const methodField = (l) => (l.methodOther || (l.method && !METHODS.includes(l.method))
        ? `<input data-f="method" value="${esc(l.method)}" placeholder="How it went on" ${TEXT_ATTRS} autocapitalize="sentences" aria-label="How it went on">`
        : `<select data-f="method" aria-label="How it went on"><option value="">How it went on…</option>${METHODS.map((m) => opt(m, l.method)).join("")}<option value="__other">Other…</option></select>`);
      const showLines = () => {
        linesBox.innerHTML = lines.map((l, i) => {
          const g = glazeById(l.glazeId);
          const orphan = l.glazeId && l.glazeId !== "new" && !g; // glaze was deleted
          return `<div class="gline" data-i="${i}">
            <div class="gline-top">
              <span class="ord num" aria-hidden="true">${i + 1}</span>
              ${l.glazeId === "new"
                ? `<input data-f="name" value="${esc(l.name)}" placeholder="New glaze name" ${TEXT_ATTRS} autocapitalize="words" aria-label="New glaze name">`
                : `<button type="button" class="pick-btn" data-pick="${i}" aria-label="Glaze ${i + 1}: ${esc(g ? gLabel(g) : orphan ? l.name : "pick a glaze")}">
                    ${g ? glazeThumb(g) : `<span class="gdot" aria-hidden="true"></span>`}
                    <span class="nm${g || orphan ? "" : " placeholder"}">${esc(g ? gLabel(g) : orphan ? `${l.name} (deleted)` : "Pick a glaze…")}</span>${g && g.runner ? `<span class="chip no runs">Runs</span>` : ""}</button>`}
              ${i > 0 ? `<button type="button" class="l-remove l-move" data-up="${i}" aria-label="Move glaze ${i + 1} earlier" title="Move up">↑</button>` : ""}
              ${i < lines.length - 1 ? `<button type="button" class="l-remove l-move" data-down="${i}" aria-label="Move glaze ${i + 1} later" title="Move down">↓</button>` : ""}
              <button type="button" class="l-remove" data-rm="${i}" aria-label="Remove glaze ${i + 1}">×</button>
            </div>
            <div class="gline-row">
              <label class="coats"><input data-f="coats" inputmode="decimal" value="${esc(l.coats)}" placeholder="#" aria-label="Number of coats" autocomplete="off"><span aria-hidden="true">coats</span></label>
              ${methodField(l)}
              <input data-f="where" value="${esc(l.where)}" placeholder="Where: inside, bottom 2/3…" ${TEXT_ATTRS} autocapitalize="sentences" aria-label="Where on the piece">
            </div>
            <input data-f="how" value="${esc(l.how)}" placeholder="Other notes, e.g. 4 second dip" ${TEXT_ATTRS} autocapitalize="sentences" aria-label="Other notes on this glaze">
          </div>`;
        }).join("") || `<p class="hint" style="margin-bottom:8px">No glazes on this piece yet.</p>`;
      };
      showLines();
      const chooseFor = (i) => pickGlaze(lines[i].glazeId, (id, typed) => {
        const l = lines[i];
        l.glazeId = id; l.name = id === "new" ? typed : (glazeById(id) || {}).name || "";
        showLines();
        const row = linesBox.children[i];
        if (row && id === "new" && !typed) row.querySelector("[data-f=name]").focus();
        el.dispatchEvent(new Event("input"));
      });  // the same glaze can go on more than once (e.g. 3 coats outside, 1 inside)
      linesBox.addEventListener("input", (e) => {
        const row = e.target.closest(".gline"), f = e.target.dataset.f; if (!row || !f || e.target.tagName === "SELECT") return;
        lines[Number(row.dataset.i)][f] = e.target.value;
      });
      linesBox.addEventListener("change", (e) => {
        if (e.target.tagName !== "SELECT") return;
        const i = Number(e.target.closest(".gline").dataset.i), l = lines[i];
        if (e.target.value === "__other") { l.method = ""; l.methodOther = true; showLines(); linesBox.children[i].querySelector("[data-f=method]").focus(); }
        else l.method = e.target.value;
      });
      linesBox.addEventListener("click", (e) => {
        const pk = e.target.closest("[data-pick]"); if (pk) return chooseFor(Number(pk.dataset.pick));
        const up = e.target.closest("[data-up]");
        if (up) { const i = Number(up.dataset.up); [lines[i - 1], lines[i]] = [lines[i], lines[i - 1]]; return showLines(); }
        const dn = e.target.closest("[data-down]");
        if (dn) { const i = Number(dn.dataset.down); [lines[i], lines[i + 1]] = [lines[i + 1], lines[i]]; return showLines(); }
        const rm = e.target.closest("[data-rm]"); if (!rm) return;
        lines.splice(Number(rm.dataset.rm), 1); showLines();
      });
      el.querySelector("#p-add-line").addEventListener("click", () => {
        lines.push({ glazeId: "", name: "", coats: "", method: "", where: "", how: "" }); showLines(); chooseFor(lines.length - 1);
      });
      wireForm(el);

      el.querySelector("#p-cancel").addEventListener("click", closeSheet);
      el.querySelector("#pform").addEventListener("submit", async (e) => {
        e.preventDefault();
        const name = el.querySelector("#p-title").value.trim();
        if (!name) { el.querySelector("#p-title").focus(); toast("Give the piece a name.", "warn"); return; }
        if (photos.some((ph) => !ph.src && !ph.id) || (bottom && !bottom.src && !bottom.id)) { toast("A photo is still loading. Try again in a moment.", "warn"); return; }
        let clay = el.querySelector("#p-clay").value;
        if (clay === "__new") {
          clay = el.querySelector("#p-clay-new").value.trim();
          if (!clay) { const d = el.querySelector('[data-sect="clay"]'); d.open = true; el.querySelector("#p-clay-new").focus(); toast("Type the new clay's name.", "warn"); return; }
          const same = clays().find((c) => c.toLowerCase() === clay.toLowerCase());
          if (same) clay = same;
          else await api.save("glazes", uid(), { name: clay, type: "clay", brand: "", rating: "", notes: "", createdAt: Date.now() });
        }
        // New glazes typed here get added to the Glazes tab (or matched to one already there)
        const out = [];
        for (const l of lines) {
          const extra = { coats: (l.coats || "").trim(), method: (l.method || "").trim(), where: (l.where || "").trim(), how: (l.how || "").trim() };
          if (l.glazeId === "new") {
            const nm = (l.name || "").trim(); if (!nm) continue;
            let g = glazeByName(nm) || state.glazes.find((x) => x.code && sameCode(x.code, nm));
            if (!g) { g = { id: uid(), name: nm, type: "glaze", brand: "", rating: "", notes: "", createdAt: Date.now() }; const { id, ...data } = g; await api.save("glazes", id, data); }
            out.push({ glazeId: g.id, name: g.name, ...extra });
          } else if (l.glazeId) out.push({ glazeId: l.glazeId, name: lineName(l), ...extra });
        }
        const v = (id) => { const f = el.querySelector("#" + id); return f ? f.value.trim() : ""; };
        const stages = {};
        for (const [k] of STAGES) if (k !== "finished" && v("p-st-" + k)) stages[k] = v("p-st-" + k);
        const photoIds = photos.map((ph) => ph.id || storePhoto(ph.src));
        const bottomPhotoId = bottom ? bottom.id || storePhoto(bottom.src) : "";
        const data = {
          name, artist: mine ? myName() || p.artist || "" : readChoice(el, "p-artist"), date: v("p-st-finished"), stages,

  // ---------- Backups (photos aren't included; they stay in the app) ----------
  const toCSV = (rows) => {
    const q = (v) => { const s = String(v ?? ""); return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
    return rows.map((r) => r.map(q).join(",")).join("\r\n") + "\r\n";

  function downloadPieces() {

  // ---------- Importing glazes from a spreadsheet (CSV) ----------
  // Reads this app's own glaze backup, or any sheet with columns like Code / Name / Mfg.
  // A glaze already in the app (same code, or same name when either has no code) only gets its blanks filled in.
  function parseCSV(text) {
    const rows = []; let row = [], cell = "", q = false;
    text = text.replace(/^﻿/, "");
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) {
        if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
        else cell += c;
      } else if (c === '"') q = true;
      else if (c === ",") { row.push(cell); cell = ""; }
      else if (c === "\n" || c === "\r") { if (c === "\r" && text[i + 1] === "\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; }
      else cell += c;
    }
    if (cell || row.length) { row.push(cell); rows.push(row); }
    return rows.filter((r) => r.some((x) => x.trim()));
  }
  const IMPORT_COLS = {
    code: ["code"], name: ["name", "glaze"], type: ["kind", "type"],
    brand: ["manufacturer / supplier", "manufacturer", "mfg", "brand", "supplier", "maker"],
    color: ["color", "colour"], size: ["size"], price: ["price"], where: ["best place to buy", "where to buy", "where"],
    cone: ["fire temp", "cone", "fire temp / cone"], bisque: ["bisque temp", "bisque"], clayType: ["clay it works on"],
    runner: ["runner"], shrinkage: ["shrinkage (%)", "shrinkage"], rating: ["liked it?", "rating"],
    description: ["description"], recipe: ["recipe"], notes: ["notes", "comments"], owners: ["owners", "owner", "who has it"],
  };
  async function importGlazes(file) {
    let rows;
    try { rows = parseCSV(await file.text()); } catch (e) { console.error(e); return toast("Couldn't read that file.", "err"); }
    const head = (rows.shift() || []).map((h) => h.trim().toLowerCase());
    const col = {}; for (const [k, names] of Object.entries(IMPORT_COLS)) { const i = head.findIndex((h) => names.includes(h)); if (i >= 0) col[k] = i; }
    if (col.name == null) return toast("That file needs a column called Name. Save it from Excel as CSV, or use a Download backup file.", "warn");
    const added = [], filled = []; let same = 0;
    const pool = state.glazes.slice();
    for (const r of rows) {
      const get = (k) => (col[k] == null ? "" : (r[col[k]] || "").trim());
      const name = get("name"); if (!name) continue;
      const typeTxt = get("type").toLowerCase();
      const ratingTxt = get("rating").toLowerCase();
      const rec = {
        code: get("code"), name, type: (SUPPLY_TYPES.find(([k, l]) => k === typeTxt || l.toLowerCase() === typeTxt) || ["glaze"])[0],
        brand: get("brand"), color: get("color"), size: get("size"), price: get("price").replace(/^\$/, ""), where: get("where"),
        cone: get("cone"), bisque: get("bisque"), clayType: get("clayType"), runner: /^(y|yes|true|x)$/i.test(get("runner")), shrinkage: get("shrinkage"),
        rating: (RATINGS.find(([k, l]) => k === ratingTxt || l.toLowerCase() === ratingTxt) || [""])[0],
        description: get("description"), recipe: get("recipe"), notes: get("notes"),
      };
      const own = [...new Set(get("owners").split(/[;,]/).map((x) => x.trim()).filter(Boolean).map((x) => (x.toLowerCase() === STUDIO.toLowerCase() ? STUDIO : matchPerson(x) || x)))];
      if (own.length) rec.owners = own;
      const nm = name.toLowerCase();
      const match = (rec.code && pool.find((g) => g.code && sameCode(g.code, rec.code)))
        || pool.find((g) => (g.name || "").trim().toLowerCase() === nm && (!g.code || !rec.code || sameCode(g.code, rec.code)));
      if (match) {
        const blanks = {};
        for (const [k, v] of Object.entries(rec)) if (v && k !== "type" && k !== "owners" && !match[k]) blanks[k] = v;
        // Owners are added to, never replaced
        if (rec.owners && rec.owners.some((o) => !ownersOf(match).includes(o))) blanks.owners = [...new Set([...ownersOf(match), ...rec.owners])];
        if (Object.keys(blanks).length) filled.push({ g: match, blanks }); else same++;
      } else {
        const g = { id: uid(), ...rec, photoId: "", createdAt: Date.now() + added.length };
        added.push(g); pool.push(g);
      }
    }
    if (!added.length && !filled.length) return toast(same ? "Everything in that file is already here." : "Didn't find any glazes in that file.", "warn");
    const msg = [added.length ? `add ${(added.length === 1 ? "1 new glaze or supply" : added.length + " new glazes and supplies")}` : "", filled.length ? `fill in missing details on ${(filled.length === 1 ? "1" : filled.length)} you already have` : ""].filter(Boolean).join(" and ");
    if (!confirm(`This will ${msg}. Nothing already filled in gets changed. Go ahead?`)) return;
    for (const g of added) { const { id, ...data } = g; await api.save("glazes", id, data); }
    for (const { g, blanks } of filled) { const { id, ...data } = g; await api.save("glazes", id, { ...data, ...blanks }); }
    toast(`Imported: ${added.length} added${filled.length ? `, ${filled.length} filled in` : ""}`, "ok");
  }

  const IMPORT_HEADERS = ["Code", "Name", "Kind", "Owners", "Manufacturer / supplier", "Color", "Size", "Price", "Best place to buy", "Fire temp", "Bisque temp",

  // Swiping photos on a card: remember where each card is, and fetch the next photo as it comes into view
  function loadSlides(strip, i) {
    [i, i + 1].forEach((k) => {
      const img = strip.children[k] && strip.children[k].querySelector("img[data-pid]");
      if (img && !img.getAttribute("src")) loadPhoto(img.dataset.pid).then((src) => { if (src) img.src = src; });
    });
  }
  const stripAt = (s) => Math.round(s.scrollLeft / Math.max(1, s.clientWidth));
  document.addEventListener("scroll", (e) => {
    const s = e.target; if (!(s instanceof Element) || !s.matches(".strip")) return;
    const i = stripAt(s); state.strip[s.dataset.strip] = i;
    const n = s.parentElement.querySelector("[data-strip-n]"); if (n) n.textContent = `${i + 1} / ${s.children.length}`;
    loadSlides(s, i);
  }, true);
  view.addEventListener("touchstart", (e) => { const s = e.target.closest && e.target.closest(".strip"); if (s) loadSlides(s, stripAt(s)); }, { passive: true });
  view.addEventListener("click", async (e) => {
    const t = e.target;
    if (t.closest("[data-act='clear-examples']")) return clearExamples();
    if (t.closest("[data-act='csv-pieces']")) return downloadPieces();
    if (t.closest("[data-act='csv-glazes']")) return downloadGlazes();
    if (t.closest("[data-act='import-glazes']")) return importSheet();
    if (t.closest("[data-act='clear-filters']")) { Object.assign(state, { search: "", filterGlaze: "", filterForm: "", filterTag: "", filterStatus: "", filterArtist: "" }); return render(); }
    if (t.closest("[data-act='filter-glaze']")) return pickGlaze(state.filterGlaze, (id) => { state.filterGlaze = id; render(); window.scrollTo(0, 0); }, { filter: true });
    const sa = t.closest("[data-sarr]");
    if (sa) {
      const s = sa.parentElement.querySelector(".strip"), n = s.children.length;
      const to = (stripAt(s) + Number(sa.dataset.sarr) + n) % n;

    if (zg) { const g = glazeById(zg.dataset.zoomGlaze); if (g) viewPhotos([await loadPhoto(g.photoId)], 0, g.name); return; }
    const gp = t.closest("[data-glaze-pieces]");
    if (gp) { Object.assign(state, { filterGlaze: gp.dataset.glazePieces, search: "", filterForm: "", filterTag: "", filterStatus: "", tab: "pieces" }); render(); window.scrollTo(0, 0); return; }
    const cp = t.closest("[data-clay-pieces]");
    if (cp) { Object.assign(state, { filterGlaze: "", search: cp.dataset.clayPieces, filterForm: "", filterTag: "", filterStatus: "", tab: "pieces" }); render(); window.scrollTo(0, 0); return; }
    const pc = t.closest("[data-piece]"); if (pc) return pieceView(pieceById(pc.dataset.piece));
    const gl = t.closest("[data-glaze]"); if (gl) return glazeView(glazeById(gl.dataset.glaze));
    const r = t.closest("[data-rating]"); if (r) { state.filterRating = r.dataset.rating; render(); return; }
    const ty = t.closest("[data-type]"); if (ty) { state.filterType = ty.dataset.type; render(); return; }
  });
  view.addEventListener("input", (e) => {
    if (e.target.id === "q") { state.search = e.target.value; render(); }
    if (e.target.id === "gq") { state.gsearch = e.target.value; render(); }
  });
  view.addEventListener("change", (e) => {
    const f = e.target.dataset && e.target.dataset.filter;
    if (f) { state[f] = e.target.value; render(); }
  });

  render();
  connect();
}
</script>
<script>
// Keep popups and the box being typed in clear of the on-screen keyboard. iOS doesn't shrink the page
// for the keyboard, it only shrinks the "visual viewport", so popups sized to the screen end up half hidden.
(function () {
  var vv = window.visualViewport; if (!vv) return;
  var root = document.documentElement, typing = /^(INPUT|TEXTAREA|SELECT)$/;
  function inPopup(el) { return el && el.closest && el.closest(".sheet, .picker"); }
  function fit() {
    var open = window.innerHeight - vv.height > 120 && vv.scale < 1.05; // keyboard (not pinch-zoom) is taking space
    root.classList.toggle("kb-open", open);
    if (open) { root.style.setProperty("--kb-h", vv.height + "px"); root.style.setProperty("--kb-top", vv.offsetTop + "px"); }
    else { root.style.removeProperty("--kb-h"); root.style.removeProperty("--kb-top"); }
  }
  function reveal() {
    var a = document.activeElement;
    if (a && typing.test(a.tagName) && inPopup(a)) a.scrollIntoView({ block: "center", behavior: "smooth" });
  }
  vv.addEventListener("resize", function () { fit(); setTimeout(reveal, 60); });
  // After the iPhone share or print screen closes, a scrolling popup can stop responding to touch until it's re-laid out.
  // Coming back to the app, nudge every scrolling popup so it scrolls again.
  function unstick() {
    fit();
    document.querySelectorAll(".sheet, .picker-list, .sv-page").forEach(function (el) {
      var top = el.scrollTop; el.style.overflow = "hidden"; void el.offsetHeight; el.style.overflow = ""; el.scrollTop = top;
    });
  }
  document.addEventListener("visibilitychange", function () { if (!document.hidden) setTimeout(unstick, 50); });
  window.addEventListener("focus", function () { setTimeout(unstick, 50); });
  window.addEventListener("pageshow", function () { setTimeout(unstick, 50); });
  // Pinch-zooming in and back out can leave a popup unable to scroll too: once the zoom settles back to normal, nudge it
  var zoomed = false, settle = 0;
  vv.addEventListener("resize", function () {
    if (vv.scale > 1.05) zoomed = true;
    else if (zoomed) { clearTimeout(settle); settle = setTimeout(function () { zoomed = false; unstick(); }, 250); }
  });
  document.addEventListener("gestureend", function () { setTimeout(unstick, 300); });
  vv.addEventListener("scroll", fit);
  document.addEventListener("focusin", function (e) { if (typing.test(e.target.tagName) && inPopup(e.target)) setTimeout(function () { fit(); reveal(); }, 350); });
})();
</script>
<script>
// Auto-update: when she comes back to the app (and every 15 minutes while it's open), ask GitHub Pages
// whether a newer copy of this page has been published. If so, reload, but only when nothing is in
// progress: no popup or photo open and no box being typed in. Otherwise it waits for the next check.
(function () {
  var MIN_GAP = 2 * 60 * 1000, lastCheck = 0, checking = false, waiting = false;
  var here = Date.parse(document.lastModified);
  // Tidy the ?v=... back off the address after an update, so it doesn't end up in bookmarks or shared links
  try { var cur = new URL(location.href); if (cur.searchParams.has("v")) { cur.searchParams.delete("v"); history.replaceState(history.state, "", cur.pathname + cur.search + cur.hash); } } catch (e) {}
  if (location.protocol !== "https:" && location.hostname !== "localhost") return;
  function busy() {
    var sheet = document.getElementById("sheet-root");
    if (sheet && sheet.children.length) return true;
    if (document.querySelector(".viewer, .cropper")) return true;
    var a = document.activeElement;
    return !!(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName));
  }
  function check() {
    if (checking || document.hidden || !navigator.onLine || Date.now() - lastCheck < MIN_GAP) return;
    checking = true; lastCheck = Date.now();
    // "reload" skips the phone's saved copy and refreshes it, so the reload below gets the new page
    fetch(location.pathname, { cache: "reload" }).then(function (r) {
      var there = Date.parse(r.headers.get("Last-Modified") || "");
      if (!r.ok || isNaN(there) || isNaN(here) || there - here < 1000) return;
      var tried = "";
      try { tried = sessionStorage.getItem("ver-reload") || ""; } catch (e) {}
      if (tried === String(there)) return; // already reloaded for this version once; don't loop
      if (busy()) { lastCheck = 0; waiting = true; return; } // try again when the popup closes or next time
      try { sessionStorage.setItem("ver-reload", String(there)); } catch (e) {}
      // A plain reload in the iPhone home-screen app can show the copy it already has. Asking for the page at a
      // new address (?v=...) can't be answered from that copy, so the new version actually loads.
      var u = new URL(location.href); u.searchParams.set("v", String(there));
      location.replace(u.toString());
    }).catch(function () {}).then(function () { checking = false; });
  }
  document.addEventListener("visibilitychange", check);
  window.addEventListener("focus", check);
  window.addEventListener("pageshow", check);
  setInterval(check, 15 * 60 * 1000);
  var sheetRoot = document.getElementById("sheet-root");
  if (sheetRoot && window.MutationObserver) new MutationObserver(function () {
    if (waiting && !sheetRoot.children.length) { waiting = false; setTimeout(check, 800); }
  }).observe(sheetRoot, { childList: true });
})();
</script>
