        if (phCover !== undefined) { photos.unshift(photos.splice(Number(phCover), 1)[0]); showPhotos(); return toast("That photo is now the cover"); }
        const ph = photos[Number(phRot)]; b.disabled = true;
        try { ph.src = await rotatePhoto(ph.src); ph.id = ""; } catch (ex) { console.error(ex); toast("Couldn't turn that photo.", "err"); }
        showPhotos();
      });
      el.querySelector("#p-file").addEventListener("change", async (e) => {
        const files = [...(e.target.files || [])]; e.target.value = "";
        const room = MAX_PHOTOS - photos.length;
        if (files.length > room) toast(`Up to ${MAX_PHOTOS} photos per piece; added the first ${room}.`, "warn");
        const add = el.querySelector("#p-photo-add"); if (add) { add.disabled = true; add.lastChild.textContent = "Loading…"; }
        const take = files.slice(0, room);
        for (const [n, f] of take.entries()) {
          try { const src = await addPhoto(f, take.length > 1 ? `Photo ${n + 1} of ${take.length}` : "Crop the photo"); if (src) photos.push({ id: "", src }); }
          catch (ex) { console.error(ex); toast("Couldn't open that photo. Try a JPG or PNG.", "err"); }
        }
        showPhotos();
      });
      onePhoto(el.querySelector("#p-bottom"), () => bottom, (v) => { bottom = v; },
        { label: "bottom photo", addText: "Bottom photo", fileInput: el.querySelector("#p-bfile"), caption: () => `${el.querySelector("#p-title").value.trim()} (bottom)` });

      const clayNew = el.querySelector("#p-clay-new-wrap");
      el.querySelector("#p-clay").addEventListener("change", (e) => {
        clayNew.hidden = e.target.value !== "__new";
        if (!clayNew.hidden) el.querySelector("#p-clay-new").focus();
      });

      // Glaze lines: numbered in order; a button with the glaze's photo opens the glaze list
      const linesBox = el.querySelector("#p-lines");
      const methodField = (l) => (l.methodOther || (l.method && !METHODS.includes(l.method))
        ? `<input data-f="method" value="${esc(l.method)}" placeholder="How it went on" ${TEXT_ATTRS} autocapitalize="sentences" aria-label="How it went on">`
        : `<select data-f="method" aria-label="How it went on"><option value="">How it went on…</option>${METHODS.map((m) => opt(m, l.method)).join("")}<option value="__other">Other…</option></select>`);
      const showLines = () => {
        linesBox.innerHTML = lines.map((l, i) => {
          const g = glazeById(l.glazeId);
          const orphan = l.glazeId && l.glazeId !== "new" && !g; // glaze was deleted
          return `<div class="gline" data-i="${i}">
            <div class="gline-top">
              <span class="ord num" aria-hidden="true">${i + 1}</span>
              ${l.glazeId === "new"
                ? `<input data-f="name" value="${esc(l.name)}" placeholder="New glaze name" ${TEXT_ATTRS} autocapitalize="words" aria-label="New glaze name">`
                : `<button type="button" class="pick-btn" data-pick="${i}" aria-label="Glaze ${i + 1}: ${esc(g ? g.name : orphan ? l.name : "pick a glaze")}">
                    ${g ? glazeThumb(g) : `<span class="gdot" aria-hidden="true"></span>`}
                    <span class="nm${g || orphan ? "" : " placeholder"}">${esc(g ? g.name : orphan ? `${l.name} (deleted)` : "Pick a glaze…")}</span></button>`}
              ${i > 0 ? `<button type="button" class="l-remove" data-up="${i}" aria-label="Move glaze ${i + 1} earlier" title="Move up">↑</button>` : ""}
              <button type="button" class="l-remove" data-rm="${i}" aria-label="Remove glaze ${i + 1}">×</button>
            </div>
            <div class="gline-row">
              <label class="coats"><input data-f="coats" inputmode="decimal" value="${esc(l.coats)}" placeholder="#" aria-label="Number of coats" autocomplete="off"><span aria-hidden="true">coats</span></label>
              ${methodField(l)}
              <input data-f="where" value="${esc(l.where)}" placeholder="Where: inside, bottom 2/3…" ${TEXT_ATTRS} autocapitalize="sentences" aria-label="Where on the piece">
            </div>
            <input data-f="how" value="${esc(l.how)}" placeholder="Other notes, e.g. 4 second dip" ${TEXT_ATTRS} autocapitalize="sentences" aria-label="Other notes on this glaze">
          </div>`;
        }).join("") || `<p class="hint" style="margin-bottom:8px">No glazes on this piece yet.</p>`;
      };
      showLines();
      const chooseFor = (i) => pickGlaze(lines[i].glazeId, (id, typed) => {
        const l = lines[i];
        l.glazeId = id; l.name = id === "new" ? typed : (glazeById(id) || {}).name || "";
        showLines();
        const row = linesBox.children[i];
        if (row && id === "new" && !typed) row.querySelector("[data-f=name]").focus();
        el.dispatchEvent(new Event("input"));
      }, { skip: lines.map((l) => l.glazeId) });
      linesBox.addEventListener("input", (e) => {
        const row = e.target.closest(".gline"), f = e.target.dataset.f; if (!row || !f || e.target.tagName === "SELECT") return;
        lines[Number(row.dataset.i)][f] = e.target.value;
      });
      linesBox.addEventListener("change", (e) => {
        if (e.target.tagName !== "SELECT") return;
        const i = Number(e.target.closest(".gline").dataset.i), l = lines[i];
        if (e.target.value === "__other") { l.method = ""; l.methodOther = true; showLines(); linesBox.children[i].querySelector("[data-f=method]").focus(); }
        else l.method = e.target.value;
      });
      linesBox.addEventListener("click", (e) => {
        const pk = e.target.closest("[data-pick]"); if (pk) return chooseFor(Number(pk.dataset.pick));
        const up = e.target.closest("[data-up]");
        if (up) { const i = Number(up.dataset.up); [lines[i - 1], lines[i]] = [lines[i], lines[i - 1]]; return showLines(); }
        const rm = e.target.closest("[data-rm]"); if (!rm) return;
        lines.splice(Number(rm.dataset.rm), 1); showLines();
      });
      el.querySelector("#p-add-line").addEventListener("click", () => {
        lines.push({ glazeId: "", name: "", coats: "", method: "", where: "", how: "" }); showLines(); chooseFor(lines.length - 1);
      });
      wireForm(el);

      el.querySelector("#p-cancel").addEventListener("click", closeSheet);
      el.querySelector("#pform").addEventListener("submit", async (e) => {
        e.preventDefault();
        const name = el.querySelector("#p-title").value.trim();
        if (!name) { el.querySelector("#p-title").focus(); toast("Give the piece a name.", "warn"); return; }
        if (photos.some((ph) => !ph.src && !ph.id) || (bottom && !bottom.src && !bottom.id)) { toast("A photo is still loading. Try again in a moment.", "warn"); return; }
        let clay = el.querySelector("#p-clay").value;
        if (clay === "__new") {
          clay = el.querySelector("#p-clay-new").value.trim();
          if (!clay) { const d = el.querySelector('[data-sect="clay"]'); d.open = true; el.querySelector("#p-clay-new").focus(); toast("Type the new clay's name.", "warn"); return; }
          const same = clays().find((c) => c.toLowerCase() === clay.toLowerCase());
          if (same) clay = same;
          else await api.save("glazes", uid(), { name: clay, type: "clay", brand: "", rating: "", notes: "", createdAt: Date.now() });
        }
        // New glazes typed here get added to the Glazes tab (or matched to one already there)
        const out = [];
        for (const l of lines) {
          const extra = { coats: (l.coats || "").trim(), method: (l.method || "").trim(), where: (l.where || "").trim(), how: (l.how || "").trim() };
          if (l.glazeId === "new") {
            const nm = (l.name || "").trim(); if (!nm) continue;
            let g = glazeByName(nm);
            if (!g) { g = { id: uid(), name: nm, type: "glaze", brand: "", rating: "", notes: "", createdAt: Date.now() }; const { id, ...data } = g; await api.save("glazes", id, data); }
            out.push({ glazeId: g.id, name: g.name, ...extra });
          } else if (l.glazeId) out.push({ glazeId: l.glazeId, name: lineName(l), ...extra });
        }
        const v = (id) => el.querySelector("#" + id).value.trim();
        const stages = {};
        for (const [k] of STAGES) if (k !== "finished" && v("p-st-" + k)) stages[k] = v("p-st-" + k);
        const photoIds = photos.map((ph) => ph.id || storePhoto(ph.src));
        const bottomPhotoId = bottom ? bottom.id || storePhoto(bottom.src) : "";
        const data = {
          name, artist: readChoice(el, "p-artist"), date: v("p-st-finished"), stages,
          form: readChoice(el, "p-form"), size: readPills(el, "p-size")[0] || "", techniques: readPills(el, "p-tech"), slab: v("p-slab"), tags: readPills(el, "p-tags"),
          clay, clayKind: readPills(el, "p-clay-kind")[0] || "", clayGrams: v("p-grams"), weight: v("p-weight"), dimBefore: v("p-dim-before"), dimAfter: v("p-dim-after"), volumeOz: v("p-volume"),
          glazes: out, layering: readChoice(el, "p-layering"), glazeNotes: v("p-gnotes"), decor: readPills(el, "p-decor"), decorTech: v("p-dtech"), tools: v("p-tools"),
          firing: readChoice(el, "p-firing"), bisqueTemp: v("p-bisque"), fireTemp: v("p-gfire"),
          priceLow: v("p-price-lo").replace(/^\$/, ""), priceHigh: v("p-price-hi").replace(/^\$/, ""),
          notes: v("p-notes"), photoIds, bottomPhotoId,
          createdAt: p.createdAt || Date.now(),
        };
        if (p.example) data.example = true;
        const ok = await api.save("pieces", p.id || uid(), data);
        if (ok) {
          const keep = [...photoIds, bottomPhotoId];
          piecePhotoIds(p).filter((id) => !keep.includes(id)).forEach(dropPhoto); // removed or rotated
          closeSheet(); toast(isNew ? "Piece added" : "Saved", "ok");
        }
      });
      if (!isNew) armDelete(el.querySelector("#p-del"), "Delete", async () => {
        if (await api.remove("pieces", p.id)) { piecePhotoIds(p).forEach(dropPhoto); closeSheet(); toast("Piece deleted", "ok"); }
      });
    }, { big: true, ro: !canEdit() });
  }

  // Glazes, underglazes, clay bodies and other supplies all use this popup
  function glazeSheet(g, { type = "glaze" } = {}) {
    const isNew = !g;
    g = g || { name: "", brand: "", rating: "", notes: "", type };
    let photo = g.photoId ? { id: g.photoId, src: photoCache.get(g.photoId) || "" } : null;
    const clay = isClay(g);
    const usedOn = isNew ? [] : (clay ? piecesWithClay(g.name) : piecesWithGlaze(g.id)).sort(pieceSort);
    openSheet(`
      <h3>${isNew ? "Add a glaze or supply" : `Edit ${esc(typeLabel(g.type).toLowerCase())}`}</h3>
      <form id="gform" novalidate>
        <div class="fgrid">
          <div class="full photo-one">
            <div id="g-photo-box"></div>
            <p class="hint">A test tile, a swatch or the jar.</p>
            <input class="vh" type="file" id="g-file" accept="image/*" tabindex="-1" aria-hidden="true">
          </div>
          <label class="f full">Name<input id="g-title" required value="${esc(g.name)}" placeholder="e.g. Floating Blue" ${TEXT_ATTRS} autocapitalize="words"></label>
          <label class="f">Kind<select id="g-type">${SUPPLY_TYPES.map(([k, l]) => `<option value="${k}"${k === typeOf(g) ? " selected" : ""}>${l}</option>`).join("")}</select></label>
          <div class="f full"><span>Did you like it?</span>${pillSet("g-rating", RATINGS, [g.rating || ""], { single: true, label: "Did you like it?" })}</div>
        </div>
        <div class="sects">
          ${sect("buy", "Buying", `
            ${textIn("g-brand", "Manufacturer / supplier", g.brand, "e.g. Amaco Potter's Choice", { full: true })}
            ${textIn("g-size", "Size", g.size, "e.g. 1 pint, 25 lb")}
            ${canEdit() ? numIn("g-price", "Price ($)", g.price, "e.g. 18.99", { pre: "$" }) : ""}
            ${textIn("g-where", "Best place to buy", g.where, "e.g. the clay store on Main", { full: true })}`)}
          ${sect("fire", "Color and firing", `
            ${textIn("g-color", "Color", g.color, "e.g. Blue, speckled tan")}
            ${textIn("g-cone", "Fire temp / cone", g.cone, "e.g. Cone 5–6")}
            ${textIn("g-bisque", "Bisque temp / cone", g.bisque, "e.g. Cone 04")}
            ${textIn("g-clay", "Clay it works on", g.clayType, "e.g. Speckled Buff", { attrs: "data-not-clay" })}
            <div class="f full" data-not-clay><span>Does it run?</span>${pillSet("g-runner", [["yes", "Runner: it runs"]], [g.runner ? "yes" : ""], { label: "Does it run?" })}</div>
            ${numIn("g-shrink", "Shrinkage (%)", g.shrinkage, "e.g. 12", { attrs: "data-only-clay", unit: "% shrinkage" })}`)}
          ${sect("notes", "Notes", `
            <label class="f full">Description<textarea id="g-desc" rows="3" placeholder="What it looks like" ${TEXT_ATTRS} autocapitalize="sentences">${esc(g.description)}</textarea></label>
            <label class="f full">Recipe / formula<textarea id="g-recipe" rows="3" placeholder="If you mix it yourself" ${TEXT_ATTRS} autocapitalize="sentences">${esc(g.recipe)}</textarea></label>
            <label class="f full">Notes<textarea id="g-notes" rows="4" placeholder="How many coats, how it breaks, runs or pools, what clay it looks best on" ${TEXT_ATTRS} autocapitalize="sentences">${esc(g.notes)}</textarea></label>`)}
        </div>
        ${usedOn.length ? `<div style="margin-top:16px"><div class="sect-label">Used on</div><div class="gchips">${usedOn.map((p) => {
          const src = photoSrc(pieceIds(p)[0]);
          return `<button type="button" class="gchip" data-open-piece="${esc(p.id)}">${src ? `<img src="${esc(src)}" alt="">` : `<span class="dot"></span>`}<span>${esc(p.name)}</span></button>`;
        }).join("")}</div></div>` : ""}
      </form>
      <div class="actions">
        ${isNew ? "" : `<button class="btn danger" id="g-del" type="button">Delete</button>`}
        <div class="right"><button class="btn ghost" type="button" id="g-cancel">Cancel</button><button class="btn" type="submit" form="gform">${isNew ? "Add" : "Save"}</button></div>
      </div>`, (el) => {
      onePhoto(el.querySelector("#g-photo-box"), () => photo, (v) => { photo = v; },
        { label: "photo", fileInput: el.querySelector("#g-file"), caption: () => el.querySelector("#g-title").value.trim() });
      const kind = el.querySelector("#g-type");
      const showKind = () => {
        el.querySelectorAll("[data-only-clay]").forEach((x) => (x.hidden = kind.value !== "clay"));
        el.querySelectorAll("[data-not-clay]").forEach((x) => (x.hidden = kind.value === "clay"));
      };
      showKind(); kind.addEventListener("change", showKind);
      el.querySelector("form").addEventListener("click", (e) => {
        const op = e.target.closest("[data-open-piece]"); if (op) pieceSheet(pieceById(op.dataset.openPiece));
      });
      wireForm(el);
      el.querySelector("#g-cancel").addEventListener("click", closeSheet);
      el.querySelector("#gform").addEventListener("submit", async (e) => {
        e.preventDefault();
        const v = (id) => el.querySelector("#" + id).value.trim();
        const name = v("g-title");
        if (!name) { el.querySelector("#g-title").focus(); toast("Give it a name.", "warn"); return; }
        const clash = glazeByName(name);
        if (clash && clash.id !== g.id) { el.querySelector("#g-title").focus(); toast(`There's already one called ${clash.name}.`, "warn"); return; }
        if (photo && !photo.src && !photo.id) { toast("The photo is still loading. Try again in a moment.", "warn"); return; }
        const type = kind.value;
        const data = {
          name, type, brand: v("g-brand"), size: v("g-size"), price: v("g-price").replace(/^\$/, ""), where: v("g-where"),
          color: v("g-color"), cone: v("g-cone"), bisque: v("g-bisque"),
          clayType: type === "clay" ? "" : v("g-clay"), runner: type !== "clay" && readPills(el, "g-runner").includes("yes"), shrinkage: type === "clay" ? v("g-shrink") : "",
          rating: readPills(el, "g-rating")[0] || "", description: v("g-desc"), recipe: v("g-recipe"), notes: v("g-notes"),
          createdAt: g.createdAt || Date.now(),
        };
        if (photo) data.photoId = photo.id || storePhoto(photo.src);
        if (g.example) data.example = true;
        const ok = await api.save("glazes", g.id || uid(), data);
        if (ok) {
          if (g.photoId && g.photoId !== data.photoId) dropPhoto(g.photoId); // replaced, rotated or removed
          // Pieces name their clay, so a renamed clay body carries over to them
          if (!isNew && clay && g.name && g.name !== name) for (const p of piecesWithClay(g.name)) { const { id, ...rest } = p; api.save("pieces", id, { ...rest, clay: name }); }
          closeSheet(); toast(isNew ? `${typeLabel(type)} added` : "Saved", "ok");
        }
      });
      if (!isNew) armDelete(el.querySelector("#g-del"), "Delete", async () => {
        if (await api.remove("glazes", g.id)) { dropPhoto(g.photoId); closeSheet(); toast(usedOn.length ? "Deleted. Pieces that used it keep its name." : "Deleted", "ok"); }
      });
    }, { big: true, ro: !canEdit() });
  }

  async function clearExamples() {
    const btn = document.getElementById("clear-ex"); if (btn) btn.disabled = true;
    for (const p of state.pieces.filter((x) => x.example)) { await api.remove("pieces", p.id); pieceIds(p).forEach(dropPhoto); }
    for (const g of state.glazes.filter((x) => x.example)) { await api.remove("glazes", g.id); dropPhoto(g.photoId); }
    toast("Examples removed", "ok");
  }

  // ---------- Backups (photos aren't included; they stay in the app) ----------
  const toCSV = (rows) => {
    const q = (v) => { const s = String(v ?? ""); return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
    return rows.map((r) => r.map(q).join(",")).join("\r\n") + "\r\n";
  };
  function downloadPieces() {
    const rows = [["Name", "Artist", "Form", "Size", "Status", ...STAGES.map(([, l]) => l), "Technique", "Marked as", "Slab thickness", "Clay body", "New or recycled", "Clay used (g)", "Weight",
      "Size before firing", "Size after firing", "Holds (oz)", "Glazes (in order)", "Layering technique", "Glaze description", "Decorations", "Decorative techniques", "Tools used",
      "Firing type", "Bisque temp", "Glaze firing temp", "Price low", "Price high", "My comments", "Photos"]];
    for (const p of state.pieces.slice().sort(pieceSort)) {
      rows.push([p.name, p.artist, p.form, p.size, (statusOf(p) || [, ""])[1], ...STAGES.map(([k]) => stageDate(p, k)), (p.techniques || []).join("; "), (p.tags || []).map(tagLabel).join("; "), p.slab,
        p.clay, p.clayKind, p.clayGrams, p.weight, p.dimBefore, p.dimAfter, p.volumeOz,
        (p.glazes || []).map((l, i) => `${i + 1}. ${lineText(l)}`).join("; "), p.layering, p.glazeNotes, (p.decor || []).join("; "), p.decorTech, p.tools,
        p.firing, p.bisqueTemp, p.fireTemp, p.priceLow, p.priceHigh, p.notes, piecePhotoIds(p).length]);
    }
    downloadFile(toCSV(rows), `pottery-pieces-${todayStr()}.csv`);
  }
  function downloadGlazes() {
    const rows = [["Name", "Kind", "Manufacturer / supplier", "Color", "Size", "Price", "Best place to buy", "Fire temp", "Bisque temp", "Clay it works on", "Runner", "Shrinkage (%)",
      "Liked it?", "Description", "Recipe", "Notes", "Pieces used on"]];
    for (const g of state.glazes.slice().sort(glazeSort)) {
      rows.push([g.name, typeLabel(g.type), g.brand, g.color, g.size, g.price, g.where, g.cone, g.bisque, g.clayType, g.runner ? "Yes" : "", g.shrinkage,
        ratingLabel(g.rating), g.description, g.recipe, g.notes, (isClay(g) ? piecesWithClay(g.name) : piecesWithGlaze(g.id)).length]);
    }
    downloadFile(toCSV(rows), `pottery-supplies-${todayStr()}.csv`);
  }

  // ---------- Events ----------
  document.querySelector("nav.tabs").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-tab]"); if (!b) return;
    state.tab = b.dataset.tab; render(); window.scrollTo(0, 0);
  });
  document.getElementById("people").addEventListener("click", peopleSheet);
  document.getElementById("fab").addEventListener("click", () => (state.tab === "glazes" ? glazeSheet(null, { type: state.filterType || "glaze" }) : pieceSheet()));
  const view = document.getElementById("view");
  // Swiping photos on a card: remember where each card is, and fetch the next photo as it comes into view
  function loadSlides(strip, i) {
    [i, i + 1].forEach((k) => {
      const img = strip.children[k] && strip.children[k].querySelector("img[data-pid]");
      if (img && !img.getAttribute("src")) loadPhoto(img.dataset.pid).then((src) => { if (src) img.src = src; });
    });
  }
  const stripAt = (s) => Math.round(s.scrollLeft / Math.max(1, s.clientWidth));
  document.addEventListener("scroll", (e) => {
    const s = e.target; if (!(s instanceof Element) || !s.matches(".strip")) return;
    const i = stripAt(s); state.strip[s.dataset.strip] = i;
    const n = s.parentElement.querySelector("[data-strip-n]"); if (n) n.textContent = `${i + 1} / ${s.children.length}`;
    loadSlides(s, i);
  }, true);
  view.addEventListener("touchstart", (e) => { const s = e.target.closest && e.target.closest(".strip"); if (s) loadSlides(s, stripAt(s)); }, { passive: true });
  view.addEventListener("click", async (e) => {
    const t = e.target;
    if (t.closest("[data-act='clear-examples']")) return clearExamples();
    if (t.closest("[data-act='csv-pieces']")) return downloadPieces();
    if (t.closest("[data-act='csv-glazes']")) return downloadGlazes();
    if (t.closest("[data-act='clear-filters']")) { Object.assign(state, { search: "", filterGlaze: "", filterForm: "", filterTag: "", filterStatus: "", filterArtist: "" }); return render(); }
    if (t.closest("[data-act='filter-glaze']")) return pickGlaze(state.filterGlaze, (id) => { state.filterGlaze = id; render(); window.scrollTo(0, 0); }, { filter: true });
    const sa = t.closest("[data-sarr]");
    if (sa) {
      const s = sa.parentElement.querySelector(".strip"), n = s.children.length;
      const to = (stripAt(s) + Number(sa.dataset.sarr) + n) % n;
      loadSlides(s, to); s.scrollTo({ left: to * s.clientWidth, behavior: "smooth" }); return;
    }
    const zp = t.closest("[data-zoom-piece]");
    if (zp) { const p = pieceById(zp.dataset.zoomPiece); if (p) viewPhotos(await Promise.all(piecePhotoIds(p).map(loadPhoto)), Number(zp.dataset.i || 0), p.name); return; }
    const zg = t.closest("[data-zoom-glaze]");
    if (zg) { const g = glazeById(zg.dataset.zoomGlaze); if (g) viewPhotos([await loadPhoto(g.photoId)], 0, g.name); return; }
    const gp = t.closest("[data-glaze-pieces]");
    if (gp) { Object.assign(state, { filterGlaze: gp.dataset.glazePieces, search: "", filterForm: "", filterTag: "", filterStatus: "", tab: "pieces" }); render(); window.scrollTo(0, 0); return; }
    const cp = t.closest("[data-clay-pieces]");
    if (cp) { Object.assign(state, { filterGlaze: "", search: cp.dataset.clayPieces, filterForm: "", filterTag: "", filterStatus: "", tab: "pieces" }); render(); window.scrollTo(0, 0); return; }
    const pc = t.closest("[data-piece]"); if (pc) return pieceSheet(pieceById(pc.dataset.piece));
    const gl = t.closest("[data-glaze]"); if (gl) return glazeSheet(glazeById(gl.dataset.glaze));
    const r = t.closest("[data-rating]"); if (r) { state.filterRating = r.dataset.rating; render(); return; }
    const ty = t.closest("[data-type]"); if (ty) { state.filterType = ty.dataset.type; render(); return; }
  });
  view.addEventListener("input", (e) => {
    if (e.target.id === "q") { state.search = e.target.value; render(); }
    if (e.target.id === "gq") { state.gsearch = e.target.value; render(); }
  });
  view.addEventListener("change", (e) => {
    const f = e.target.dataset && e.target.dataset.filter;
    if (f) { state[f] = e.target.value; render(); }
  });

  render();
  connect();
}
</script>
<script>
// Keep popups and the box being typed in clear of the on-screen keyboard. iOS doesn't shrink the page
// for the keyboard, it only shrinks the "visual viewport", so popups sized to the screen end up half hidden.
(function () {
  var vv = window.visualViewport; if (!vv) return;
  var root = document.documentElement, typing = /^(INPUT|TEXTAREA|SELECT)$/;
  function inPopup(el) { return el && el.closest && el.closest(".sheet, .picker"); }
  function fit() {
    var open = window.innerHeight - vv.height > 120 && vv.scale < 1.05; // keyboard (not pinch-zoom) is taking space
    root.classList.toggle("kb-open", open);
    if (open) { root.style.setProperty("--kb-h", vv.height + "px"); root.style.setProperty("--kb-top", vv.offsetTop + "px"); }
    else { root.style.removeProperty("--kb-h"); root.style.removeProperty("--kb-top"); }
  }
  function reveal() {
    var a = document.activeElement;
    if (a && typing.test(a.tagName) && inPopup(a)) a.scrollIntoView({ block: "center", behavior: "smooth" });
  }
  vv.addEventListener("resize", function () { fit(); setTimeout(reveal, 60); });
  vv.addEventListener("scroll", fit);
  document.addEventListener("focusin", function (e) { if (typing.test(e.target.tagName) && inPopup(e.target)) setTimeout(function () { fit(); reveal(); }, 350); });
})();
</script>
<script>
// Auto-update: when she comes back to the app (and every 15 minutes while it's open), ask GitHub Pages
// whether a newer copy of this page has been published. If so, reload, but only when nothing is in
// progress: no popup or photo open and no box being typed in. Otherwise it waits for the next check.
(function () {
  var MIN_GAP = 2 * 60 * 1000, lastCheck = 0, checking = false, waiting = false;
  var here = Date.parse(document.lastModified);
  if (location.protocol !== "https:" && location.hostname !== "localhost") return;
  function busy() {
    var sheet = document.getElementById("sheet-root");
    if (sheet && sheet.children.length) return true;
    if (document.querySelector(".viewer, .cropper")) return true;
    var a = document.activeElement;
    return !!(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName));
  }
  function check() {
    if (checking || document.hidden || !navigator.onLine || Date.now() - lastCheck < MIN_GAP) return;
    checking = true; lastCheck = Date.now();
    // "reload" skips the phone's saved copy and refreshes it, so the reload below gets the new page
    fetch(location.pathname, { cache: "reload" }).then(function (r) {
      var there = Date.parse(r.headers.get("Last-Modified") || "");
      if (!r.ok || isNaN(there) || isNaN(here) || there - here < 1000) return;
      var tried = "";
      try { tried = sessionStorage.getItem("ver-reload") || ""; } catch (e) {}
      if (tried === String(there)) return; // already reloaded for this version once; don't loop
      if (busy()) { lastCheck = 0; waiting = true; return; } // try again when the popup closes or next time
      try { sessionStorage.setItem("ver-reload", String(there)); } catch (e) {}
      location.reload();
    }).catch(function () {}).then(function () { checking = false; });
  }
  document.addEventListener("visibilitychange", check);
  window.addEventListener("focus", check);
  window.addEventListener("pageshow", check);
  setInterval(check, 15 * 60 * 1000);
  var sheetRoot = document.getElementById("sheet-root");
  if (sheetRoot && window.MutationObserver) new MutationObserver(function () {
    if (waiting && !sheetRoot.children.length) { waiting = false; setTimeout(check, 800); }
  }).observe(sheetRoot, { childList: true });
})();
</script>
