<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pottery Tracker</title>
<meta name="theme-color" content="#9A4E2F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pottery">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone/tablet-first journal — sticky header with two tabs, photo cards, floating "Add" button; more columns on wider screens */
:root {
  --bg: #F6F1EC;
  --surface: #FFFFFF;
  --ink: #2B231E;
  --muted: #74675E;
  --line: #E6DCD3;
  --accent: #9A4E2F;
  --accent-ink: #FFFFFF;
  --accent-soft: #F5E7DF;
  --good: #3F7D58;
  --good-soft: #E3F0E7;
  --warn: #A5602A;
  --warn-soft: #F8EADC;
  --danger: #B3343F;
  --font-display: "Fraunces", Georgia, serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --radius: 14px;
  --shadow: 0 1px 2px rgba(43,35,30,.06), 0 4px 16px rgba(43,35,30,.07);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #18130F; --surface: #241D18; --ink: #F2EAE3; --muted: #B0A196; --line: #3A3029;
    --accent: #E59C78; --accent-ink: #24160F; --accent-soft: #3A2A21; --good: #7CC79A; --good-soft: #213328;
    --warn: #E9AE72; --warn-soft: #3A2B1D; --danger: #F07A84;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #18130F; --surface: #241D18; --ink: #F2EAE3; --muted: #B0A196; --line: #3A3029;
  --accent: #E59C78; --accent-ink: #24160F; --accent-soft: #3A2A21; --good: #7CC79A; --good-soft: #213328;
  --warn: #E9AE72; --warn-soft: #3A2B1D; --danger: #F07A84;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.45; }
[hidden] { display: none !important; }
.head-right { display: flex; align-items: center; gap: 10px; }
.signin { max-width: 400px; margin: 8vh auto 0; display: grid; gap: 14px; }
.signin p { margin: 0; color: var(--muted); }
.signin .err { color: var(--danger); font-size: .9rem; min-height: 1.2em; }
.signin .err.ok { color: var(--good); }
.si-links { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.si-links .linkbtn { padding: 6px 0; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.num { font-variant-numeric: tabular-nums; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--surface); border-bottom: 1px solid var(--line);
}
.wrap { max-width: 1080px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
/* Wide browser windows: use the room for more cards per row (up to 1800px) */
@media (min-width: 1200px) { .wrap { max-width: min(1800px, calc(100vw - 64px)); } }
.head-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 14px 10px; }
h1 { font-family: var(--font-display); font-weight: 600; font-size: 1.45rem; margin: 0; display: flex; align-items: center; gap: 8px; }
h1 svg { flex: none; }
h1 .title-stack { display: flex; flex-direction: column; line-height: 1.15; }
h1 .ver { font-family: var(--font-body); font-size: .68rem; font-weight: 500; color: var(--muted); }
h1 .ver:empty { display: none; }
.sync { font-size: .8rem; color: var(--muted); }
nav.tabs { display: flex; gap: 6px; padding-block: 0 10px; }
nav.tabs button {
  flex: 1; border: 0; background: transparent; padding: 10px 12px; border-radius: 999px;
  font-weight: 600; font-size: 1rem; color: var(--muted);
}
nav.tabs button[aria-selected="true"] { background: var(--accent-soft); color: var(--accent); }
.head-right .linkbtn { white-space: nowrap; }
/* Phones: one-line title, a dot for "Synced", and less padding so the header takes about half the room */
@media (max-width: 600px) {
  .head-row { padding-block: 8px 6px; gap: 8px; }
  h1 { font-size: 1.15rem; gap: 7px; }
  h1 svg { width: 22px; height: 22px; }
  h1 .title-stack { white-space: nowrap; }
  h1 .ver { font-size: .6rem; }
  .head-right { gap: 4px; }
  .head-right .linkbtn { font-size: .95rem; padding: 6px; }
  .sync { font-size: .72rem; white-space: nowrap; }
  .sync.ok { font-size: 0; width: 8px; height: 8px; border-radius: 50%; background: var(--good); margin-right: 4px; }
  nav.tabs { padding-block: 0 8px; }
  nav.tabs button { padding: 7px 10px; font-size: .95rem; }
}

main { padding-block: 18px 110px; display: grid; gap: 16px; }
.panel { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; min-width: 0; }
.panel h2 { font-family: var(--font-display); font-weight: 600; font-size: 1.15rem; margin: 0 0 12px; text-wrap: balance; }
.label { text-transform: uppercase; letter-spacing: .07em; font-size: .72rem; font-weight: 700; color: var(--muted); }
.banner { background: var(--warn-soft); color: var(--ink); border-radius: var(--radius); padding: 12px 14px; font-size: .92rem; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.empty { color: var(--muted); font-size: .95rem; padding-block: 6px; }
.vh { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; pointer-events: none; }
.count { margin-top: 10px; color: var(--muted); font-size: .88rem; }

/* Toolbar */
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.toolbar .search { flex: 1 1 220px; }
.pills { display: flex; gap: 6px; flex-wrap: wrap; }
.pills button { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 8px 14px; font-weight: 600; color: var(--ink); min-height: 42px; }
.pills button[aria-pressed="true"], .pills button[aria-checked="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
/* A button that opens the glaze photo list, in place of a dropdown */
.pick-btn { display: flex; align-items: center; gap: 10px; flex: 1 1 200px; min-width: 0; min-height: 46px; padding: 6px 12px 6px 6px; text-align: left;
  background: var(--bg); border: 1px solid var(--line); border-radius: 10px; font-weight: 600; }
.pick-btn .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pick-btn .nm.placeholder { color: var(--muted); font-weight: 500; }
.pick-btn::after { content: ""; flex: none; width: 8px; height: 8px; border: solid var(--muted); border-width: 0 2px 2px 0; transform: rotate(45deg) translateY(-2px); margin-right: 4px; }
.thumb, .gdot { width: 34px; height: 34px; border-radius: 8px; object-fit: cover; flex: none; background: var(--accent-soft); display: inline-grid; place-items: center; color: var(--accent); font-weight: 800; }

/* Cards */
.cards { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
.card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.card .pic { position: relative; aspect-ratio: 4 / 3; background: var(--accent-soft); border: 0; padding: 0; width: 100%; display: block; overflow: hidden; }
button.pic { cursor: zoom-in; }
/* Absolutely placed so a tall (portrait) photo can't stretch the card */
.card .pic img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.card .pic .nopic { position: absolute; inset: 0; display: grid; place-items: center; color: var(--accent); opacity: .55; }
.card .pic .more { position: absolute; right: 8px; bottom: 8px; background: rgba(20,14,10,.6); color: #fff; font-size: .75rem; font-weight: 700; padding: 3px 8px; border-radius: 999px; }
.card .body { padding: 12px 14px 14px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; min-width: 0; align-content: start; flex: 1;
  border: 0; background: none; text-align: left; width: 100%; color: inherit; }
button.body { cursor: pointer; }
button.body:hover .name { color: var(--accent); }
.card .name { font-family: var(--font-display); font-weight: 600; font-size: 1.12rem; line-height: 1.2; overflow-wrap: anywhere; }
.code { font-family: var(--font-body, inherit); font-size: .78em; font-weight: 700; letter-spacing: .02em; padding: 1px 7px; border-radius: 6px; background: var(--accent-soft); color: var(--ink); white-space: nowrap; vertical-align: 1px; }
.card .meta { font-size: .86rem; color: var(--muted); }
.card .notes { font-size: .9rem; color: var(--ink); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; white-space: pre-line; }
.card .foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; padding: 0 14px 12px; }
/* Glazes are a swatch library: two across on a phone, square photos */
.cards.glz { grid-template-columns: repeat(auto-fill, minmax(155px, 1fr)); gap: 10px; }
.cards.glz .pic { aspect-ratio: 1; }
.cards.glz .body { padding: 10px 12px 8px; }
.cards.glz .notes { -webkit-line-clamp: 5; }
.cards.glz .foot { padding: 0 12px 10px; }
.gchips { display: flex; gap: 6px; flex-wrap: wrap; }
.gchip { display: inline-flex; align-items: center; gap: 6px; font-size: .8rem; font-weight: 600; padding: 3px 10px 3px 3px; border-radius: 999px; background: var(--accent-soft); color: var(--ink); max-width: 100%; }
.gchip img, .gchip .dot { width: 20px; height: 20px; border-radius: 50%; object-fit: cover; flex: none; background: var(--line); }
.gchip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
button.gchip { border: 0; cursor: pointer; }

.chip { display: inline-block; font-size: .75rem; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.chip.love { background: var(--good-soft); color: var(--good); }
.chip.no { background: var(--warn-soft); color: var(--warn); }
.chip.ex { background: transparent; border: 1px dashed var(--line); color: var(--muted); }

/* Controls */
.btn { border: 0; border-radius: 999px; padding: 11px 18px; font-weight: 600; background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; color: var(--accent); border: 1px solid var(--line); }
.btn.small { padding: 7px 13px; font-size: .9rem; }
.btn.danger { background: transparent; color: var(--danger); border: 1px solid var(--line); }
.btn.danger.armed { background: var(--danger); color: #fff; border-color: var(--danger); }
.btn:disabled { opacity: .6; }
.linkbtn { border: 0; background: none; color: var(--accent); font-weight: 600; padding: 6px 4px; }
input, select, textarea { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; min-width: 0; font-size: 16px; }
textarea { resize: vertical; min-height: 96px; }
.f { display: grid; gap: 4px; font-size: .88rem; font-weight: 600; color: var(--muted); min-width: 0; }
.fgrid { display: grid; gap: 14px; grid-template-columns: 1fr 1fr; }
.fgrid .full { grid-column: 1 / -1; }
@media (max-width: 420px) { .fgrid { grid-template-columns: 1fr; } }

/* Small round "back to the top" arrow, bottom left; shows once the page is scrolled down a way */
.totop { position: fixed; z-index: 6; left: calc(18px + env(safe-area-inset-left, 0px)); bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--accent);
  display: grid; place-items: center; padding: 0; box-shadow: var(--shadow); cursor: pointer; opacity: .92; }
.totop[hidden] { display: none; }
.fab {
  position: fixed; z-index: 6;
  right: calc(18px + env(safe-area-inset-right, 0px)); bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  box-shadow: 0 6px 20px rgba(154,78,47,.35); padding: 15px 22px; font-size: 1.05rem;
  display: inline-flex; align-items: center; gap: 8px;
}

/* Sheet */
.overlay { position: fixed; inset: 0; z-index: 20; background: rgba(24,16,10,.45); display: flex; align-items: flex-end; justify-content: center; }
@media (min-width: 640px) { .overlay { align-items: center; } }
.sheet { background: var(--surface); width: 100%; max-width: 560px; max-height: 92%; overflow: auto;
  border-radius: 20px 20px 0 0; padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
@media (min-width: 640px) { .sheet { border-radius: 20px; } }
/* Big sheets nearly fill the screen, leaving little backdrop to tap by accident */
.sheet.big { height: calc(100% - 10px - env(safe-area-inset-top, 0px)); max-height: none; }
@media (min-width: 640px) { .sheet.big { max-width: 720px; height: auto; min-height: 80%; max-height: 94%; } }
/* Tablets: nearly fill the screen too, since a stray tap on the backdrop closes it */
@media (min-width: 640px) and (pointer: coarse) {
  .sheet.big { width: calc(100% - 24px); max-width: 960px; min-height: 0; max-height: none;
    height: calc(100% - 24px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); }
}
.sheet h3 { font-family: var(--font-display); font-weight: 600; font-size: 1.3rem; margin: 0 0 14px; }
.sheet .actions { display: flex; gap: 10px; justify-content: space-between; margin-top: 18px; flex-wrap: wrap; }
.sheet .actions .right { display: flex; gap: 10px; margin-left: auto; }
.sheet .hint { margin: 0; color: var(--muted); font-size: .85rem; }
.sect-label { font-size: .88rem; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
.pp-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
.pp-head h3 { margin: 0; }
.signview { position: fixed; inset: 0; z-index: 70; background: var(--bg); display: flex; flex-direction: column; }
.sv-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; padding: calc(10px + env(safe-area-inset-top, 0px)) 12px 10px; border-bottom: 1px solid var(--line); background: var(--surface); }
.sv-acts { display: flex; gap: 8px; }
.sv-page { flex: 1; overflow: auto; padding: 16px; display: grid; place-items: start center; }
.sv-page img { width: 100%; max-width: 640px; height: auto; box-shadow: 0 4px 24px rgba(0,0,0,.25); background: #fff; }
@media print {
  @page { size: letter; margin: 0; }
  body.printing-sign > *:not(.signview) { display: none !important; }
  body.printing-sign { background: #fff !important; }
  body.printing-sign .signview { position: static; background: #fff; display: block; }
  body.printing-sign .sv-bar { display: none !important; }
  body.printing-sign .sv-page { padding: 0; display: block; overflow: visible; }
  body.printing-sign .sv-page img { max-width: none; width: 100%; box-shadow: none; }
}
.share-qr { display: grid; place-items: center; background: #fff; border-radius: 16px; padding: 16px; width: min(280px, 100%); margin: 0 auto; }
.share-qr img { width: 100%; height: auto; display: block; image-rendering: pixelated; }
.share-link { text-align: center; color: var(--muted); font-size: .88rem; overflow-wrap: anywhere; margin: 10px 0 0; }
a.btn { text-decoration: none; display: inline-flex; align-items: center; }
.view .vhead h3 { margin-bottom: 4px; }
.view .vhead h3 .code { font-size: .7em; vertical-align: 3px; }
.view .vsub { color: var(--muted); font-weight: 600; }
.view .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.vphotos { display: flex; gap: 8px; overflow-x: auto; margin-top: 14px; scrollbar-width: none; }
.vphotos button { position: relative; flex: 0 0 150px; aspect-ratio: 1; border: 0; padding: 0; border-radius: 12px; overflow: hidden; background: var(--accent-soft); cursor: zoom-in; }
.vphotos.one button { flex-basis: 220px; }
.vphotos img { width: 100%; height: 100%; object-fit: cover; display: block; }
.vphotos .tagb { position: absolute; left: 6px; bottom: 6px; background: rgba(20,14,10,.6); color: #fff; font-size: .72rem; font-weight: 700; padding: 2px 7px; border-radius: 999px; }
.vsect { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); }
.vsect h4 { margin: 0 0 8px; font-size: .74rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.vlist { margin: 0; display: grid; grid-template-columns: minmax(90px, max-content) 1fr; gap: 6px 16px; }
.vlist dt { color: var(--muted); font-size: .92rem; }
.vlist dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; }
.vlabel { color: var(--muted); font-size: .92rem; margin-top: 10px; }
.vtext { margin: 2px 0 0; white-space: pre-line; overflow-wrap: anywhere; }
.vlines { display: grid; gap: 6px; margin-bottom: 10px; }
.vline { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; background: var(--bg); color: inherit; font: inherit; }
button.vline { cursor: pointer; }
.vline .thumb, .vline .gdot { width: 40px; height: 40px; border-radius: 8px; flex: none; object-fit: cover; }
.vnum { flex: none; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: #fff; font-size: .78rem; font-weight: 700; }
.vgl { min-width: 0; flex: 1; }
.vgl small { display: block; color: var(--muted); font-size: .85rem; }

/* Photos in the edit sheet */
.photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); gap: 8px; }
.ph { position: relative; aspect-ratio: 1; border-radius: 12px; overflow: hidden; background: var(--bg); }
.ph > button.img { border: 0; padding: 0; width: 100%; height: 100%; display: block; background: none; cursor: zoom-in; }
.ph img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.ph .loading { width: 100%; height: 100%; display: grid; place-items: center; color: var(--muted); font-size: .8rem; }
.ph-acts { position: absolute; top: 6px; right: 6px; display: flex; gap: 6px; }
.ph-acts button { width: 34px; height: 34px; border-radius: 50%; border: 0; background: rgba(255,255,255,.92); color: #2B231E; font-size: 1.05rem; font-weight: 700; box-shadow: 0 1px 4px rgba(0,0,0,.25); line-height: 1; padding: 0; }
.ph .cover { position: absolute; left: 6px; bottom: 6px; background: var(--accent); color: var(--accent-ink); font-size: .72rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; }
.ph-add { aspect-ratio: 1; border-radius: 12px; border: 2px dashed var(--line); background: none; color: var(--accent); font-weight: 600; font-size: .9rem; display: grid; place-content: center; gap: 2px; text-align: center; padding: 8px; }
.ph-add b { font-size: 1.5rem; line-height: 1; }
.photo-one { display: flex; gap: 14px; align-items: center; }
.photo-one .ph, .photo-one .ph-add { width: 128px; flex: none; }
.photo-one .opts { display: grid; gap: 8px; justify-items: start; }

/* Glaze lines on a piece */
.gline { border: 1px solid var(--line); border-radius: 12px; padding: 10px; display: grid; gap: 8px; margin-bottom: 8px; }
.gline-top { display: flex; gap: 8px; align-items: center; }
.gline-top .pick-btn, .gline-top input { flex: 1; min-width: 0; }
.l-remove { width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line); background: var(--bg); font-size: 1.2rem; line-height: 1; flex: none; }
.l-move { width: 36px; }

/* Glaze photo list (opens over everything, like a full-size dropdown) */
.picker-ov { position: fixed; inset: 0; z-index: 25; background: rgba(24,16,10,.45); display: flex; align-items: flex-end; justify-content: center; }
.picker { background: var(--surface); width: 100%; max-width: 560px; height: calc(100% - 10px - env(safe-area-inset-top, 0px)); border-radius: 20px 20px 0 0;
  display: flex; flex-direction: column; padding-bottom: env(safe-area-inset-bottom, 0px); }
@media (min-width: 640px) { .picker-ov { align-items: center; } .picker { border-radius: 20px; max-width: 720px; height: 94%; } }
@media (min-width: 640px) and (pointer: coarse) {
  .picker { width: calc(100% - 24px); max-width: 960px; height: calc(100% - 24px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); }
}
.picker-head { display: flex; align-items: center; gap: 10px; padding: 18px 16px 10px; }
.picker-head h3 { flex: 1; margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 1.3rem; }
.picker-search { padding: 0 16px 10px; display: flex; gap: 8px; }
.picker-search input { flex: 1; min-width: 0; }
.picker-search .pick-owner { width: auto; flex: none; max-width: 45%; }
.picker-list { flex: 1; overflow: auto; padding: 0 8px 12px; }
.pick-row { display: flex; width: 100%; align-items: center; gap: 12px; padding: 8px; min-height: 68px; border: 0; border-radius: 12px; background: none; text-align: left; }
.pick-row:hover, .pick-row[aria-selected="true"] { background: var(--bg); }

      <script>
        // Version = when this copy of the page was published (GitHub Pages sends it as Last-Modified), in local time.
        // It changes by itself on every update, so there's nothing to bump by hand.
        (function () {
          var d = new Date(document.lastModified); if (isNaN(d)) return;

          el.title = "Last updated " + d.toLocaleString([], { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });

  // ---------- Derived ----------
  const glazeById = (id) => (id ? state.glazes.find((g) => g.id === id) : undefined);

          ${ids.length > 1 ? `<button type="button" class="sarr l" data-sarr="-1" aria-label="Previous photo">‹</button><button type="button" class="sarr r" data-sarr="1" aria-label="Next photo">›</button><span class="more num" data-strip-n>${at + 1} / ${ids.length}</span>` : ""}</div>`
        : `<div class="pic"><div class="nopic">${POT_ICON}</div></div>`}
      <button type="button" class="body" data-piece="${esc(p.id)}" aria-label="Open ${esc(p.name)}">
        <span class="name">${esc(p.name)}</span>
        ${meta.length ? `<span class="meta">${meta.map(esc).join(" · ")}</span>` : ""}
        ${(st && st[0] !== "finished") || (p.tags || []).length || p.example ? `<span class="chips">${st && st[0] !== "finished" ? `<span class="chip prog">${esc(st[1])}</span>` : ""}${(p.tags || []).map((t) => `<span class="chip ${t === "favorite" ? "love" : t === "failed" ? "no" : ""}">${esc(tagLabel(t))}</span>`).join("")}${p.example ? `<span class="chip ex">Example</span>` : ""}</span>` : ""}
        ${lines.length ? `<span class="gchips">${lines.map((l) => `<span class="gchip">${glazeThumb(glazeById(l.glazeId), "")}<span>${esc(lineLabel(l))}</span></span>`).join("")}</span>` : ""}
        ${p.notes ? `<span class="notes">${esc(p.notes)}</span>` : ""}
      </button>
    </article>`;
  }

  function glazesHTML() {
    const q = state.gsearch.trim().toLowerCase(), fr = state.filterRating, ft = state.filterType, fo = state.filterOwner, fx = state.filterRuns;
    const owners = [...new Set(state.glazes.flatMap(ownersOf))].sort(ownerSort);
    const list = state.glazes
      .filter((g) => !ft || typeOf(g) === ft)
      .filter((g) => !fo || ownersOf(g).includes(fo))
      .filter((g) => !fr || g.rating === fr)
      .filter((g) => !fx || (fx === "yes" ? !!g.runner : !g.runner))
      .filter((g) => { if (!q) return true; const t = [g.code, g.code && g.code.replace(/[\s.-]/g, ""), g.name, g.brand, g.color, g.notes, g.description, g.where, g.recipe, typeLabel(g.type), ...ownersOf(g)].filter(Boolean).join(" ").toLowerCase(); return q.split(/\s+/).every((w) => t.includes(w)); })
      .sort(glazeSort);
    const TYPE_PLURAL = { glaze: "Glazes", underglaze: "Underglazes", stain: "Stains", lowfire: "Low-fire glazes", slip: "Slips", clay: "Clay bodies" };
    const types = SUPPLY_TYPES.filter(([k]) => state.glazes.some((g) => typeOf(g) === k));
    const used = new Map();
    for (const p of state.pieces) for (const id of new Set((p.glazes || []).map((l) => l.glazeId))) used.set(id, (used.get(id) || 0) + 1);
    const sel = (key, all, opts) => `<select data-filter="${key}" aria-label="${esc(all)}"><option value="">${esc(all)}</option>${opts.map(([v, l]) => `<option value="${esc(v)}"${state[key] === v ? " selected" : ""}>${esc(l)}</option>`).join("")}</select>`;
    return `
      <section class="panel">
        <div class="toolbar">
          <input class="search" id="gq" type="search" placeholder="Search: blue, Amaco, runs…" value="${esc(state.gsearch)}" aria-label="Search glazes and supplies" autocomplete="off">
        </div>
        <div class="filters">
          ${owners.length > 1 ? sel("filterOwner", "Everyone's", owners.map((o) => [o, o === STUDIO ? "Studio" : o + "'s"])) : ""}
          ${types.length > 1 || ft ? sel("filterType", "All kinds", types.map(([k, label]) => [k, TYPE_PLURAL[k] || label])) : ""}
          ${sel("filterRating", "Any rating", RATINGS)}
          ${sel("filterRuns", "Runs or not", [["yes", "Runners only"], ["no", "Doesn't run"]])}
        </div>
        <div class="count num">${plural(list.length, ft === "clay" ? "clay body" : "item")}${list.length !== state.glazes.length ? ` of ${state.glazes.length}` : ""}${canEdit() ? `${state.glazes.length ? ` · <button class="linkbtn" data-act="csv-glazes" type="button" style="padding:0">Download backup</button>` : ""} · <button class="linkbtn" data-act="import-glazes" type="button" style="padding:0">Import</button>` : ""}</div>
      </section>
      ${list.length ? `<div class="cards glz">${list.map((g) => {
        const clay = isClay(g), n = clay ? piecesWithClay(g.name).length : used.get(g.id) || 0, src = glazePhoto(g);
        const meta = [typeOf(g) === "glaze" ? "" : typeLabel(g.type), g.brand, g.color, notJustStudio(g) ? `Owned by ${ownersOf(g).join(", ")}` : ""].filter(Boolean);
        return `<article class="card">
          ${src ? `<button type="button" class="pic" data-zoom-glaze="${esc(g.id)}" aria-label="See ${esc(g.name)} bigger"><img src="${esc(src)}" alt="" loading="lazy"></button>`
            : `<div class="pic"><div class="nopic">${POT_ICON}</div></div>`}
          <button type="button" class="body" data-glaze="${esc(g.id)}" aria-label="Open ${esc(g.name)}">
            <span class="name">${g.code ? `<span class="code">${esc(g.code)}</span> ` : ""}${esc(g.name)}</span>
            ${meta.length ? `<span class="meta">${meta.map(esc).join(" · ")}</span>` : ""}
            ${g.description || g.notes ? `<span class="notes">${esc([g.description, g.notes].filter(Boolean).join(" — "))}</span>` : ""}
            ${g.rating || g.runner || g.example ? `<span class="chips">${g.rating ? `<span class="chip ${g.rating}">${esc(ratingLabel(g.rating))}</span>` : ""}${g.runner ? `<span class="chip no">Runner</span>` : ""}${g.example ? `<span class="chip ex">Example</span>` : ""}</span>` : ""}
          </button>
          <div class="foot">${n ? `<button class="linkbtn" type="button" ${clay ? `data-clay-pieces="${esc(g.name)}"` : `data-glaze-pieces="${esc(g.id)}"`}>Used on ${plural(n, "piece")}</button>` : `<span class="meta">Not used yet</span>`}</div>
        </article>`;
      }).join("")}</div>`
        : `<section class="panel"><div class="empty">${state.glazes.length ? "Nothing matches." : "Nothing here yet. Tap “Add” to save a glaze, underglaze or clay body with a photo and notes."}</div></section>`}`;
  }

  // ---------- People ----------
  const ROLES = [["full", "Full access"], ["admin", "Admin (hidden)"], ["student", "Student (view only)"]];
  // An admin has full access but is kept out of sight: not listed in People (except to other admins), and not offered as an artist or glaze owner
  const roleOf = (m) => (m.hidden ? "admin" : m.role === "student" ? "student" : "full");
  const shown = () => state.members.filter((m) => !m.hidden);
  const iAmAdmin = () => { const m = state.me && state.members.find((x) => x.id === state.me.uid); return !!(m && m.hidden); };
  const canEdit = () => !fs || state.role === "full";
  const myUid = () => (state.me && state.me.uid) || (fs ? "" : "demo");
  // Full access changes any piece; a student changes only the student pieces they added
  const canEditPiece = (p) => canEdit() || (state.role === "student" && !!p && !!p.student && !!p.by && p.by === myUid());
  // Who made a piece: anyone on the People list, plus any name already typed on a piece (people who don't use the app)
  // Each person has a full name and a short display name (e.g. "Jen", or "Jen H" when two people are called Jen).
  // The display name is what shows as artist and glaze owner, so it has to be unique.
  const personName = (m) => (m.short || "").trim() || (m.name || "").trim() || (m.email || "").split("@")[0];
  const nameTaken = (short, exceptId) => short.toLowerCase() === STUDIO.toLowerCase() || state.members.some((x) => x.id !== exceptId && personName(x).toLowerCase() === short.toLowerCase());
  function suggestShort(full, exceptId) {
    const parts = full.trim().split(/\s+/).filter(Boolean); if (!parts.length) return "";
    const tries = [parts[0], parts.length > 1 ? `${parts[0]} ${parts[parts.length - 1][0].toUpperCase()}` : "", parts.join(" ")].filter(Boolean);
    return tries.find((t) => !nameTaken(t, exceptId)) || parts.join(" ");
  }
  const artistNames = () => [...new Set([...shown().map(personName), ...state.pieces.map((p) => (p.artist || "").trim()), ...state.glazes.flatMap((g) => g.owners || [])].filter((n) => n && n !== STUDIO))].sort((a, b) => a.localeCompare(b));
  const myName = () => { const m = (state.me && state.members.find((x) => x.id === state.me.uid)) || state.myDoc; return m ? personName(m) : ""; };
  // New logins are made with a second, separate sign-in so making one doesn't sign her out
  let adderAuth = null;
  function getAdder() {
    if (!adderAuth) adderAuth = initializeAuth(initializeApp(firebaseConfig, "adder"), { persistence: inMemoryPersistence });
    return adderAuth;
  }
  const appLink = () => location.origin + location.pathname;
  const memberRef = (uid) => doc(fs, "studio", "shared", "members", uid);
  const requestRef = (uid) => doc(fs, "studio", "shared", "requests", uid);

  // Changing someone's names, in a popup like the rest of the app
  function personNameSheet(m) {
    const isMe = state.me && m.id === state.me.uid;
    openSheet(`
      <h3>${isMe ? "Your name" : "Edit name"}</h3>
      <p class="hint" style="margin:-4px 0 12px">${esc(m.email || "")}</p>
      <form id="pn-form" novalidate>
        <div class="fgrid">
          <label class="f full">Full name<input id="pn-name" value="${esc(m.name || "")}" placeholder="e.g. Jen Hannah" ${TEXT_ATTRS} autocapitalize="words"></label>
          <label class="f full">Display name<input id="pn-short" value="${esc(m.short || suggestShort(m.name || "", m.id))}" placeholder="e.g. Jen" ${TEXT_ATTRS} autocapitalize="words"></label>
          <p class="hint full" id="pn-hint">Shows as the artist on pieces and the owner on glazes. Keep it short, and different from everyone else's (add a last initial if two people share a first name).</p>
        </div>
        <div class="actions"><div class="right"><button class="btn ghost" type="button" id="pn-cancel">Cancel</button><button class="btn" type="submit" id="pn-save">Save</button></div></div>
      </form>`, (el) => {
      const nameIn = el.querySelector("#pn-name"), shortIn = el.querySelector("#pn-short"), hint = el.querySelector("#pn-hint");
      let touched = !!m.short;
      shortIn.addEventListener("input", () => { touched = true; check(); });
      nameIn.addEventListener("input", () => { if (!touched) shortIn.value = suggestShort(nameIn.value, m.id); check(); });
      const check = () => {
        const v = shortIn.value.trim(), taken = v && nameTaken(v, m.id);
        shortIn.setAttribute("aria-invalid", taken ? "true" : "false");
        hint.style.color = taken ? "var(--danger)" : "";
        hint.textContent = taken ? `Someone already shows as “${v}”. Try adding a last initial, like “${v} ${(nameIn.value.trim().split(/\s+/)[1] || "H")[0].toUpperCase()}”.`
          : "Shows as the artist on pieces and the owner on glazes. Keep it short, and different from everyone else's (add a last initial if two people share a first name).";
        return !taken;
      };
      el.querySelector("#pn-cancel").addEventListener("click", peopleSheet);
      el.querySelector("#pn-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const name = nameIn.value.trim(), short = shortIn.value.trim() || suggestShort(name, m.id);
        if (!short) { shortIn.focus(); return toast("Give them a display name.", "warn"); }
        if (!check()) { shortIn.focus(); return; }
        if (name === (m.name || "") && short === (m.short || "")) return peopleSheet();
        const old = personName(m), save = el.querySelector("#pn-save");
        save.disabled = true; save.textContent = "Saving…";
        try {
          const b = writeBatch(fs);
          b.update(memberRef(m.id), { name, short });
          // Pieces and glazes already marked with their old display name follow the new one
          if (short !== old) {
            state.pieces.filter((p) => p.artist === old).forEach((p) => b.update(doc(fs, "studio", "shared", "pieces", p.id), { artist: short }));
            state.glazes.filter((g) => (g.owners || []).includes(old)).forEach((g) => b.update(doc(fs, "studio", "shared", "glazes", g.id), { owners: g.owners.map((o) => (o === old ? short : o)) }));
          }
          await b.commit();
          toast("Name saved", "ok"); peopleSheet();
        } catch (ex) {
          console.error(ex); save.disabled = false; save.textContent = "Save";
          toast(ex && ex.code === "permission-denied" ? "Firebase didn't allow that. The rules need updating (see the setup guide)." : "Couldn't save the name. Try again.", "err");
        }
      });
      setTimeout(() => nameIn.focus(), 50);
    });
  }

  function refreshPeople() {
    const el = document.querySelector(".sheet.people"); if (!el) return;
    const me = state.me && state.me.uid;
    const members = (iAmAdmin() ? state.members : shown()).slice().sort((a, b) => (a.id === me ? -1 : b.id === me ? 1 : (a.name || a.email || "").localeCompare(b.name || b.email || "")));
    el.querySelector("#pp-list").innerHTML = members.map((m) => `<div class="pp-row">
        <button type="button" class="pp-who linkish" data-rename="${esc(m.id)}" aria-label="Change the names for ${esc(m.name || m.email)}"><b>${esc(m.name || m.email)}</b><small>${m.short ? `Shows as <b>${esc(m.short)}</b> · ` : ""}${esc(m.email)} · Tap to ${m.name ? "change" : "add"} name</small></button>
        ${m.id === me ? `<span class="chip">You · ${roleOf(m) === "admin" ? "Admin (hidden)" : "Full access"}</span>`
          : `<div class="pp-acts"><select data-role="${esc(m.id)}" aria-label="Access for ${esc(m.name || m.email)}">${ROLES.map(([k, l]) => `<option value="${k}"${roleOf(m) === k ? " selected" : ""}>${l}</option>`).join("")}</select>
             <label class="pp-own"><input type="checkbox" data-owner="${esc(m.id)}"${m.owner ? " checked" : ""}> Glaze owner</label>
             <button type="button" class="btn small danger" data-remove="${esc(m.id)}">Remove</button></div>`}
      </div>`).join("") || `<p class="hint">Loading…</p>`;
    el.querySelectorAll("[data-remove]").forEach((b) => armDelete(b, "Remove", async () => {
      try { await deleteDoc(memberRef(b.dataset.remove)); toast("Removed. They can't see the studio anymore.", "ok"); } catch (e) { console.error(e); toast("Couldn't remove them. Try again.", "err"); }
    }));
    const reqs = state.requests.slice().sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
    // Owner names on glazes that don't match anyone in People (e.g. typed "Jen" in an import): offer to point them at a person
    const known = new Set([STUDIO, ...state.members.map(personName)]);
    const strays = [...new Set(state.glazes.flatMap((g) => g.owners || []))].filter((o) => !known.has(o)).sort();
    el.querySelector("#pp-fix").innerHTML = strays.length && state.members.length ? `<div class="pp-waiting"><div class="sect-label">Glaze owners not in People</div>
      ${strays.map((o) => { const n = state.glazes.filter((g) => (g.owners || []).includes(o)).length, guess = matchPerson(o);
        return `<div class="pp-row"><div class="pp-who"><b>“${esc(o)}”</b><small>Owner on ${plural(n, "glaze")}. Who is this?</small></div>
          <div class="pp-acts"><select data-fix-to="${esc(o)}" aria-label="Who “${esc(o)}” is">${shown().map((m) => personName(m)).sort().map((x) => `<option${x === guess ? " selected" : ""}>${esc(x)}</option>`).join("")}</select>
          <button type="button" class="btn small" data-fix="${esc(o)}">Change</button></div></div>`; }).join("")}</div>` : "";
    el.querySelector("#pp-wait").innerHTML = reqs.length ? `<div class="pp-waiting"><div class="sect-label">Waiting to get in</div>
      ${reqs.map((r) => `<div class="pp-row">
        <div class="pp-who"><b>${esc(r.name || r.email || "Someone")}</b><small>${r.name && r.email ? `${esc(r.email)} · ` : ""}Asked to get in ${esc(new Date(r.createdAt || Date.now()).toLocaleDateString("en-US", { month: "short", day: "numeric" }))}</small></div>
        <div class="pp-acts"><button type="button" class="btn small" data-let="${esc(r.id)}" data-as="student">Student</button><button type="button" class="btn small ghost" data-let="${esc(r.id)}" data-as="full">Full access</button><button type="button" class="btn small danger" data-decline="${esc(r.id)}">No</button></div>
      </div>`).join("")}</div>` : "";
  }

  // The QR code and printable sign for the studio wall (share/qr.png and share/sign.pdf sit next to the app)
  // The printable sign, shown inside the app (a PDF opened from the home-screen app on an iPhone has no way back).
  // Print uses the phone's print screen; Share or save hands the PDF to the share sheet (Print, Save to Files, AirDrop, Messages…).
  function signView() {
    const v = document.createElement("div");
    v.className = "signview";
    v.innerHTML = `<div class="sv-bar"><button class="btn ghost small" type="button" data-sv="back">‹ Back</button>
        <div class="sv-acts"><button class="btn ghost small" type="button" data-sv="share">Share or save</button><button class="btn small" type="button" data-sv="print">Print</button></div></div>
      <div class="sv-page"><img src="share/sign.png" alt="Sign: Pottery Tracker, scan with your phone's camera"></div>`;
    document.body.appendChild(v);
    const shareBtn = v.querySelector('[data-sv="share"]'), printBtn = v.querySelector('[data-sv="print"]');
    if (!navigator.share) shareBtn.hidden = true;
    // In the iPhone/iPad home-screen app, window.print() does nothing; the share sheet has Print, so use that instead
    if (navigator.standalone && navigator.share) { printBtn.hidden = true; shareBtn.textContent = "Print or share"; shareBtn.classList.remove("ghost"); }
    v.addEventListener("click", async (e) => {
      const b = e.target.closest("[data-sv]"); if (!b) return;
      if (b.dataset.sv === "back") { v.remove(); shareSheet(); return; }
      if (b.dataset.sv === "print") { document.body.classList.add("printing-sign"); try { window.print(); } finally { setTimeout(() => document.body.classList.remove("printing-sign"), 500); } return; }
      if (b.dataset.sv === "share") {
        try {
          const blob = await (await fetch("share/sign.pdf")).blob();
          const file = new File([blob], "Pottery Tracker sign.pdf", { type: "application/pdf" });
          if (navigator.canShare && navigator.canShare({ files: [file] })) await navigator.share({ files: [file], title: "Pottery Tracker sign" });
          else await navigator.share({ title: "Pottery Tracker sign", url: new URL("share/sign.pdf", location.href).href });
        } catch (ex) { if (ex && ex.name !== "AbortError") { console.error(ex); toast("Couldn't open sharing. Try Print instead.", "warn"); } }
      }
    });
  }
  function shareSheet() {
    openSheet(`
      <h3>Share the app</h3>
      <p style="margin:0 0 12px">Students scan this with their phone's camera to open the app. They can create their own account there; you let them in from People.</p>
      <div class="share-qr"><img src="share/qr.png" alt="QR code that opens Pottery Tracker"></div>

      <div class="actions" style="flex-wrap:wrap">
        <button class="btn ghost" type="button" id="sh-back">Back</button>
