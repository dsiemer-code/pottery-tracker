<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pottery Tracker</title>
<meta name="theme-color" content="#9A4E2F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pottery">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone/tablet-first journal — sticky header with two tabs, photo cards, floating "Add" button; more columns on wider screens */
:root {
  --bg: #F6F1EC;
  --surface: #FFFFFF;
  --ink: #2B231E;
  --muted: #74675E;
  --line: #E6DCD3;
  --accent: #9A4E2F;
  --accent-ink: #FFFFFF;
  --accent-soft: #F5E7DF;
  --good: #3F7D58;
  --good-soft: #E3F0E7;
  --warn: #A5602A;
  --warn-soft: #F8EADC;
  --danger: #B3343F;
  --font-display: "Fraunces", Georgia, serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --radius: 14px;
  --shadow: 0 1px 2px rgba(43,35,30,.06), 0 4px 16px rgba(43,35,30,.07);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #18130F; --surface: #241D18; --ink: #F2EAE3; --muted: #B0A196; --line: #3A3029;
    --accent: #E59C78; --accent-ink: #24160F; --accent-soft: #3A2A21; --good: #7CC79A; --good-soft: #213328;
    --warn: #E9AE72; --warn-soft: #3A2B1D; --danger: #F07A84;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #18130F; --surface: #241D18; --ink: #F2EAE3; --muted: #B0A196; --line: #3A3029;
  --accent: #E59C78; --accent-ink: #24160F; --accent-soft: #3A2A21; --good: #7CC79A; --good-soft: #213328;
  --warn: #E9AE72; --warn-soft: #3A2B1D; --danger: #F07A84;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.45; }
[hidden] { display: none !important; }
.head-right { display: flex; align-items: center; gap: 10px; }
.signin { max-width: 400px; margin: 8vh auto 0; display: grid; gap: 14px; }
.signin p { margin: 0; color: var(--muted); }
.signin .err { color: var(--danger); font-size: .9rem; min-height: 1.2em; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.num { font-variant-numeric: tabular-nums; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--surface); border-bottom: 1px solid var(--line);
}
.wrap { max-width: 1080px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.head-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 14px 10px; }
h1 { font-family: var(--font-display); font-weight: 600; font-size: 1.45rem; margin: 0; display: flex; align-items: center; gap: 8px; }
h1 svg { flex: none; }
h1 .title-stack { display: flex; flex-direction: column; line-height: 1.15; }
h1 .ver { font-family: var(--font-body); font-size: .68rem; font-weight: 500; color: var(--muted); }
h1 .ver:empty { display: none; }
.sync { font-size: .8rem; color: var(--muted); }
nav.tabs { display: flex; gap: 6px; padding-block: 0 10px; }
nav.tabs button {
  flex: 1; border: 0; background: transparent; padding: 10px 12px; border-radius: 999px;
  font-weight: 600; font-size: 1rem; color: var(--muted);
}
nav.tabs button[aria-selected="true"] { background: var(--accent-soft); color: var(--accent); }

main { padding-block: 18px 110px; display: grid; gap: 16px; }
.panel { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; min-width: 0; }
.panel h2 { font-family: var(--font-display); font-weight: 600; font-size: 1.15rem; margin: 0 0 12px; text-wrap: balance; }
.label { text-transform: uppercase; letter-spacing: .07em; font-size: .72rem; font-weight: 700; color: var(--muted); }
.banner { background: var(--warn-soft); color: var(--ink); border-radius: var(--radius); padding: 12px 14px; font-size: .92rem; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.empty { color: var(--muted); font-size: .95rem; padding-block: 6px; }
.vh { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; pointer-events: none; }
.count { margin-top: 10px; color: var(--muted); font-size: .88rem; }

/* Toolbar */
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.toolbar .search { flex: 1 1 220px; }
.pills { display: flex; gap: 6px; flex-wrap: wrap; }
.pills button { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 8px 14px; font-weight: 600; color: var(--ink); min-height: 42px; }
.pills button[aria-pressed="true"], .pills button[aria-checked="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
/* A button that opens the glaze photo list, in place of a dropdown */
.pick-btn { display: flex; align-items: center; gap: 10px; flex: 1 1 200px; min-width: 0; min-height: 46px; padding: 6px 12px 6px 6px; text-align: left;
  background: var(--bg); border: 1px solid var(--line); border-radius: 10px; font-weight: 600; }
.pick-btn .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pick-btn .nm.placeholder { color: var(--muted); font-weight: 500; }
.pick-btn::after { content: ""; flex: none; width: 8px; height: 8px; border: solid var(--muted); border-width: 0 2px 2px 0; transform: rotate(45deg) translateY(-2px); margin-right: 4px; }
.thumb, .gdot { width: 34px; height: 34px; border-radius: 8px; object-fit: cover; flex: none; background: var(--accent-soft); display: inline-grid; place-items: center; color: var(--accent); font-weight: 800; }

/* Cards */
.cards { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
.card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.card .pic { position: relative; aspect-ratio: 4 / 3; background: var(--accent-soft); border: 0; padding: 0; width: 100%; display: block; overflow: hidden; }
button.pic { cursor: zoom-in; }
/* Absolutely placed so a tall (portrait) photo can't stretch the card */
.card .pic img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.card .pic .nopic { position: absolute; inset: 0; display: grid; place-items: center; color: var(--accent); opacity: .55; }
.card .pic .more { position: absolute; right: 8px; bottom: 8px; background: rgba(20,14,10,.6); color: #fff; font-size: .75rem; font-weight: 700; padding: 3px 8px; border-radius: 999px; }
.card .body { padding: 12px 14px 14px; display: grid; gap: 6px; min-width: 0; align-content: start; flex: 1;
  border: 0; background: none; text-align: left; width: 100%; color: inherit; }
button.body { cursor: pointer; }
button.body:hover .name { color: var(--accent); }
.card .name { font-family: var(--font-display); font-weight: 600; font-size: 1.12rem; line-height: 1.2; overflow-wrap: anywhere; }
.card .meta { font-size: .86rem; color: var(--muted); }
.card .notes { font-size: .9rem; color: var(--ink); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; white-space: pre-line; }
.card .foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; padding: 0 14px 12px; }
/* Glazes are a swatch library: two across on a phone, square photos */
.cards.glz { grid-template-columns: repeat(auto-fill, minmax(155px, 1fr)); gap: 10px; }
.cards.glz .pic { aspect-ratio: 1; }
.cards.glz .body { padding: 10px 12px 8px; }
.cards.glz .foot { padding: 0 12px 10px; }
.gchips { display: flex; gap: 6px; flex-wrap: wrap; }
.gchip { display: inline-flex; align-items: center; gap: 6px; font-size: .8rem; font-weight: 600; padding: 3px 10px 3px 3px; border-radius: 999px; background: var(--accent-soft); color: var(--ink); max-width: 100%; }
.gchip img, .gchip .dot { width: 20px; height: 20px; border-radius: 50%; object-fit: cover; flex: none; background: var(--line); }
.gchip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
button.gchip { border: 0; cursor: pointer; }

.chip { display: inline-block; font-size: .75rem; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.chip.love { background: var(--good-soft); color: var(--good); }
.chip.no { background: var(--warn-soft); color: var(--warn); }
.chip.ex { background: transparent; border: 1px dashed var(--line); color: var(--muted); }

/* Controls */
.btn { border: 0; border-radius: 999px; padding: 11px 18px; font-weight: 600; background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; color: var(--accent); border: 1px solid var(--line); }
.btn.small { padding: 7px 13px; font-size: .9rem; }
.btn.danger { background: transparent; color: var(--danger); border: 1px solid var(--line); }
.btn.danger.armed { background: var(--danger); color: #fff; border-color: var(--danger); }
.btn:disabled { opacity: .6; }
.linkbtn { border: 0; background: none; color: var(--accent); font-weight: 600; padding: 6px 4px; }
input, select, textarea { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; min-width: 0; font-size: 16px; }
textarea { resize: vertical; min-height: 96px; }
.f { display: grid; gap: 4px; font-size: .88rem; font-weight: 600; color: var(--muted); min-width: 0; }
.fgrid { display: grid; gap: 14px; grid-template-columns: 1fr 1fr; }
.fgrid .full { grid-column: 1 / -1; }
@media (max-width: 420px) { .fgrid { grid-template-columns: 1fr; } }

.fab {
  position: fixed; z-index: 6;
  right: calc(18px + env(safe-area-inset-right, 0px)); bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  box-shadow: 0 6px 20px rgba(154,78,47,.35); padding: 15px 22px; font-size: 1.05rem;
  display: inline-flex; align-items: center; gap: 8px;
}

/* Sheet */
.overlay { position: fixed; inset: 0; z-index: 20; background: rgba(24,16,10,.45); display: flex; align-items: flex-end; justify-content: center; }
@media (min-width: 640px) { .overlay { align-items: center; } }
.sheet { background: var(--surface); width: 100%; max-width: 560px; max-height: 92%; overflow: auto;
  border-radius: 20px 20px 0 0; padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
@media (min-width: 640px) { .sheet { border-radius: 20px; } }
/* Big sheets nearly fill the screen, leaving little backdrop to tap by accident */
.sheet.big { height: calc(100% - 10px - env(safe-area-inset-top, 0px)); max-height: none; }
@media (min-width: 640px) { .sheet.big { max-width: 720px; height: auto; min-height: 80%; max-height: 94%; } }
/* Tablets: nearly fill the screen too, since a stray tap on the backdrop closes it */
@media (min-width: 640px) and (pointer: coarse) {
  .sheet.big { width: calc(100% - 24px); max-width: 960px; min-height: 0; max-height: none;
    height: calc(100% - 24px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); }
}
.sheet h3 { font-family: var(--font-display); font-weight: 600; font-size: 1.3rem; margin: 0 0 14px; }
.sheet .actions { display: flex; gap: 10px; justify-content: space-between; margin-top: 18px; flex-wrap: wrap; }
.sheet .actions .right { display: flex; gap: 10px; margin-left: auto; }
.sheet .hint { margin: 0; color: var(--muted); font-size: .85rem; }
.sect-label { font-size: .88rem; font-weight: 600; color: var(--muted); margin-bottom: 6px; }

/* Photos in the edit sheet */
.photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); gap: 8px; }
.ph { position: relative; aspect-ratio: 1; border-radius: 12px; overflow: hidden; background: var(--bg); }
.ph > button.img { border: 0; padding: 0; width: 100%; height: 100%; display: block; background: none; cursor: zoom-in; }
.ph img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.ph .loading { width: 100%; height: 100%; display: grid; place-items: center; color: var(--muted); font-size: .8rem; }
.ph-acts { position: absolute; top: 6px; right: 6px; display: flex; gap: 6px; }
.ph-acts button { width: 34px; height: 34px; border-radius: 50%; border: 0; background: rgba(255,255,255,.92); color: #2B231E; font-size: 1.05rem; font-weight: 700; box-shadow: 0 1px 4px rgba(0,0,0,.25); line-height: 1; padding: 0; }
.ph .cover { position: absolute; left: 6px; bottom: 6px; background: var(--accent); color: var(--accent-ink); font-size: .72rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; }
.ph-add { aspect-ratio: 1; border-radius: 12px; border: 2px dashed var(--line); background: none; color: var(--accent); font-weight: 600; font-size: .9rem; display: grid; place-content: center; gap: 2px; text-align: center; padding: 8px; }
.ph-add b { font-size: 1.5rem; line-height: 1; }
.photo-one { display: flex; gap: 14px; align-items: center; }
.photo-one .ph, .photo-one .ph-add { width: 128px; flex: none; }
.photo-one .opts { display: grid; gap: 8px; justify-items: start; }

/* Glaze lines on a piece */
.gline { border: 1px solid var(--line); border-radius: 12px; padding: 10px; display: grid; gap: 8px; margin-bottom: 8px; }
.gline-top { display: flex; gap: 8px; align-items: center; }
.gline-top .pick-btn, .gline-top input { flex: 1; min-width: 0; }
.l-remove { width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line); background: var(--bg); font-size: 1.2rem; line-height: 1; flex: none; }

/* Glaze photo list (opens over everything, like a full-size dropdown) */
.picker-ov { position: fixed; inset: 0; z-index: 25; background: rgba(24,16,10,.45); display: flex; align-items: flex-end; justify-content: center; }
.picker { background: var(--surface); width: 100%; max-width: 560px; height: calc(100% - 10px - env(safe-area-inset-top, 0px)); border-radius: 20px 20px 0 0;
  display: flex; flex-direction: column; padding-bottom: env(safe-area-inset-bottom, 0px); }
@media (min-width: 640px) { .picker-ov { align-items: center; } .picker { border-radius: 20px; max-width: 720px; height: 94%; } }
@media (min-width: 640px) and (pointer: coarse) {
  .picker { width: calc(100% - 24px); max-width: 960px; height: calc(100% - 24px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); }
}
.picker-head { display: flex; align-items: center; gap: 10px; padding: 18px 16px 10px; }
.picker-head h3 { flex: 1; margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 1.3rem; }
.picker-search { padding: 0 16px 10px; }
.picker-list { flex: 1; overflow: auto; padding: 0 8px 12px; }
.pick-row { display: flex; width: 100%; align-items: center; gap: 12px; padding: 8px; min-height: 68px; border: 0; border-radius: 12px; background: none; text-align: left; }
.pick-row:hover, .pick-row[aria-selected="true"] { background: var(--bg); }
.pick-row .thumb, .pick-row .gdot { width: 52px; height: 52px; border-radius: 10px; font-size: 1.4rem; }
.pick-row .nm { flex: 1; min-width: 0; font-weight: 600; overflow-wrap: anywhere; }
.pick-row .meta { display: block; font-size: .84rem; font-weight: 500; color: var(--muted); }
.pick-none { margin: 8px; color: var(--muted); }

/* Clay bodies list */
.clay-list { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.clay-chip { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 999px; background: var(--bg); padding-left: 14px; font-weight: 600; }
.clay-chip small { color: var(--muted); font-weight: 500; margin-left: 6px; }
.clay-chip .x { border: 0; background: none; width: 36px; height: 36px; font-size: 1.1rem; color: var(--muted); }
.inline-add { display: flex; gap: 8px; }

/* With the on-screen keyboard up (mainly iPad), popups fit the space above it; --kb-* are set by script */
.overlay, .picker-ov { top: var(--kb-top, 0px); bottom: auto; height: var(--kb-h, 100%); }
.kb-open .sheet, .kb-open .picker { padding-bottom: 12px; }

/* Full-screen photo */
.viewer { position: fixed; inset: 0; z-index: 50; background: rgba(10,7,5,.92); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
  padding: calc(56px + env(safe-area-inset-top, 0px)) 12px calc(12px + env(safe-area-inset-bottom, 0px)); }
.viewer img { max-width: 100%; max-height: calc(100% - 80px); object-fit: contain; border-radius: 10px; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
.viewer .cap { color: #fff; font-weight: 600; text-align: center; }
.viewer .bar { display: flex; gap: 10px; align-items: center; }
.viewer .bar .btn.ghost { color: #fff; border-color: rgba(255,255,255,.35); min-width: 48px; font-size: 1.2rem; }
.viewer .bar .v-crop { margin-left: 8px; min-width: 72px; }
.viewer .bar span { color: #fff; font-weight: 600; min-width: 4ch; text-align: center; }
.viewer .v-close { position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); right: 16px; background: rgba(255,255,255,.92); color: #2B231E; }
@media (prefers-reduced-motion: no-preference) { .viewer { animation: vfade .15s ease-out; } @keyframes vfade { from { opacity: 0; } } }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(90px + env(safe-area-inset-bottom, 0px)); z-index: 60;
  display: flex; align-items: center; gap: 10px; width: max-content; max-width: calc(100% - 32px);
  background: var(--ink); color: var(--bg); padding: 11px 18px; border-radius: 999px; font-weight: 600; font-size: .95rem; box-shadow: 0 8px 28px rgba(0,0,0,.28); }
/* Saves get a big green confirmation so it's obvious they worked; problems get amber, failures red */
.toast.ok, .toast.warn, .toast.err { font-size: 1.08rem; padding: 14px 22px 14px 14px; border-radius: 18px; color: #fff; }
.toast.ok { background: #2E8B57; }
.toast.warn { background: #B8650F; }
.toast.err { background: #C0392B; }
.toast .ti { flex: none; width: 30px; height: 30px; border-radius: 50%; background: rgba(255,255,255,.95); display: grid; place-items: center; font-size: 1.05rem; font-weight: 800; }
.toast.ok .ti { color: #2E8B57; } .toast.warn .ti { color: #B8650F; } .toast.err .ti { color: #C0392B; }
@media (prefers-reduced-motion: no-preference) {
  .toast:not([hidden]) { animation: toastIn .28s cubic-bezier(.2,1.4,.4,1); }
  @keyframes toastIn { from { transform: translateX(-50%) translateY(16px) scale(.9); opacity: 0; } }
  .sheet { animation: up .22s ease-out; }
  @keyframes up { from { transform: translateY(24px); opacity: .6; } }
}

/* Count and filters on the Pieces tab */
.total { color: var(--muted); font-size: .95rem; margin-bottom: 10px; display: flex; align-items: baseline; gap: 6px; }
.total b { font-family: var(--font-display); font-size: 1.7rem; color: var(--ink); font-weight: 600; }
.filters { display: grid; gap: 8px; grid-template-columns: 1fr 1fr; margin-top: 10px; }
.filters .pick-btn { grid-column: 1 / -1; }
.filters select { min-height: 46px; padding-block: 8px; }
@media (min-width: 760px) { .filters { grid-template-columns: 1.6fr 1fr 1fr 1fr; } .filters .pick-btn { grid-column: auto; } }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip.prog { background: var(--warn-soft); color: var(--warn); }

/* Swipeable photos on a piece card */
.card .pic .strip { position: absolute; inset: 0; display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; overscroll-behavior-x: contain; }
.card .pic .strip::-webkit-scrollbar { display: none; }
.card .pic .slide { position: relative; flex: 0 0 100%; height: 100%; scroll-snap-align: start; scroll-snap-stop: always; border: 0; padding: 0; background: none; cursor: zoom-in; }
.card .pic .tagb { position: absolute; left: 8px; bottom: 8px; background: rgba(20,14,10,.6); color: #fff; font-size: .75rem; font-weight: 700; padding: 3px 8px; border-radius: 999px; }
.sarr { position: absolute; top: 50%; transform: translateY(-50%); width: 36px; height: 36px; border-radius: 50%; border: 0; padding: 0 0 3px;
  background: rgba(255,255,255,.88); color: #2B231E; font-size: 1.4rem; line-height: 1; box-shadow: 0 1px 4px rgba(0,0,0,.25); }
.sarr.l { left: 8px; } .sarr.r { right: 8px; }

/* Sections in a popup: closed by default, with a summary line of what's filled in */
.sects { display: grid; gap: 10px; margin-top: 16px; }
details.sect { border: 1px solid var(--line); border-radius: 12px; }
details.sect > summary { list-style: none; cursor: pointer; position: relative; display: grid; gap: 2px; min-height: 56px; align-content: center; padding: 10px 44px 10px 14px; }
details.sect > summary::-webkit-details-marker { display: none; }
details.sect > summary::after { content: ""; position: absolute; right: 18px; top: 50%; width: 9px; height: 9px; border: solid var(--muted); border-width: 0 2px 2px 0; transform: translateY(-75%) rotate(45deg); }
details.sect[open] > summary::after { transform: translateY(-25%) rotate(225deg); }
details.sect .st { font-weight: 700; font-size: 1.02rem; }
details.sect .sum { font-size: .85rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
details.sect .sum:empty::before { content: "Nothing filled in"; opacity: .75; }
details.sect[open] .sum { display: none; }
details.sect[open] > summary { border-bottom: 1px solid var(--line); margin-bottom: 14px; }
.sect-body { padding: 0 14px 16px; }
.f > span { display: block; }
.f .pills { margin-top: 2px; }
.f select + input { margin-top: 6px; }

/* A glaze on a piece: number, glaze, coats, how and where */
.ord { flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-weight: 700; font-size: .85rem; }
.gline-row { display: grid; gap: 8px; grid-template-columns: 104px 1fr; }
.coats { position: relative; display: block; }
.coats input { padding-right: 52px; }
.coats span { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: .85rem; pointer-events: none; }
.gline-row [data-f="where"] { grid-column: 1 / -1; }
@media (min-width: 600px) { .gline-row { grid-template-columns: 104px 1fr 1.3fr; } .gline-row [data-f="where"] { grid-column: auto; } }

/* Crop screen for a new photo */
.cropper { position: fixed; inset: 0; z-index: 55; background: #120D0A; color: #fff; display: flex; flex-direction: column;
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
.crop-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 16px; font-weight: 600; text-align: center; }
.cropper .btn.ghost { color: #fff; border-color: rgba(255,255,255,.4); }
.crop-stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 18px 28px; }
.crop-wrap { position: relative; line-height: 0; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
.crop-wrap img { display: block; max-width: calc(100vw - 56px); max-height: calc(100vh - 210px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); -webkit-user-drag: none; pointer-events: none; }
@supports (height: 100dvh) { .crop-wrap img { max-height: calc(100dvh - 210px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); } }
.crop-box { position: absolute; box-shadow: 0 0 0 9999px rgba(0,0,0,.6); outline: 2px solid #fff; cursor: move; }
.crop-box i { position: absolute; width: 26px; height: 26px; border: 4px solid #fff; }
.crop-box i::before { content: ""; position: absolute; inset: -14px; }
.crop-box [data-h=nw] { left: 0; top: 0; border-right: 0; border-bottom: 0; cursor: nwse-resize; }
.crop-box [data-h=ne] { right: 0; top: 0; border-left: 0; border-bottom: 0; cursor: nesw-resize; }
.crop-box [data-h=sw] { left: 0; bottom: 0; border-right: 0; border-top: 0; cursor: nesw-resize; }
.crop-box [data-h=se] { right: 0; bottom: 0; border-left: 0; border-top: 0; cursor: nwse-resize; }
.crop-foot { padding: 6px 16px 14px; display: grid; gap: 10px; justify-items: center; text-align: center; }
.crop-foot p { margin: 0; color: rgba(255,255,255,.75); font-size: .9rem; }
.crop-foot div { display: flex; gap: 10px; }
.crop-foot [data-msg] { min-height: 1.4em; }
.cropper .btn:disabled { opacity: .5; }

/* People */
#people { position: relative; }
.badge { display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 5px; margin-left: 4px; border-radius: 999px; background: var(--danger); color: #fff; font-size: .72rem; font-weight: 700; vertical-align: 1px; }
.pp-list { display: grid; gap: 8px; margin-bottom: 18px; }
.pp-row { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }

.pp-who.linkish { background: none; border: 0; padding: 0; text-align: left; font: inherit; color: inherit; cursor: pointer; }

.pp-who small { color: var(--muted); overflow-wrap: anywhere; }
.pp-acts { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.pp-acts select { width: auto; padding-block: 7px; }
.pp-waiting { background: var(--warn-soft); border-radius: 14px; padding: 12px; margin-bottom: 18px; }
.pp-waiting .pp-row { background: var(--surface); }
.pp-add { border-top: 1px solid var(--line); padding-top: 16px; }
.pp-card { display: grid; gap: 8px; justify-items: start; background: var(--good-soft); border-radius: 12px; padding: 12px 14px; }

/* Read-only popups (students) */
.sheet.ro .ph-acts, .sheet.ro .ph-add, .sheet.ro #p-add-line, .sheet.ro .l-remove, .sheet.ro #p-photo-hint, .sheet.ro .photo-one .hint { display: none; }

.sheet.ro ::placeholder { color: transparent; -webkit-text-fill-color: transparent; }
</style>

        <span class="title-stack">Pottery Tracker<span class="ver" id="app-ver"></span></span>

      <script>

        // It changes by itself on every update, so there's nothing to bump by hand.
        (function () {

</header>

<div class="wrap">

<button class="btn fab" id="fab" type="button" hidden>

<script type="module">

  async function openLarge(file, max = 1800) {

    document.querySelectorAll("nav.tabs button").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.tab === state.tab)));
    document.getElementById("fab-label").textContent = state.tab === "glazes" ? (state.filterType ? `Add ${typeLabel(state.filterType).toLowerCase()}` : "Add glaze or supply") : "Add piece";
    const v = document.getElementById("view");
    const active = document.activeElement && document.activeElement.id;
    let caret = active === "q" || active === "gq" ? document.activeElement.selectionStart : null;
    const member = !fs || !!state.role, signedIn = !fs || !!state.me;
    document.getElementById("tabs").hidden = !signedIn || !member;
    document.getElementById("fab").hidden = !signedIn || !canEdit();
    document.getElementById("people").hidden = !signedIn || !canEdit();
    const pn = document.getElementById("people-n"); pn.hidden = !state.requests.length; pn.textContent = state.requests.length;
    if (fs && !state.me) { v.innerHTML = ""; return; }
    if (!member) { v.innerHTML = waitingHTML(); return; }
    let html = banners();
    if (!(state.loaded.p && state.loaded.g)) html += `<div class="panel"><div class="empty">Loading your pieces…</div></div>`;
    else if (state.tab === "glazes") html += glazesHTML();
    else html += piecesHTML();
    // While she's typing or dictating into a search box, swap everything around it but leave the box itself alone.
    // Replacing it would end iPhone dictation after the first word.
    const keep = (active === "q" || active === "gq") && document.getElementById(active);
    const tmp = document.createElement("div"); tmp.innerHTML = html;
    const newQ = keep && tmp.querySelector("#" + active);
    const oldBar = newQ && keep.closest(".toolbar"), newBar = newQ && newQ.closest(".toolbar");
    const oldPanel = oldBar && oldBar.parentElement, newPanel = newBar && newBar.parentElement;
    if (oldPanel && newPanel && oldPanel.parentElement === v && newPanel.parentElement === tmp) {
      [...oldPanel.childNodes].forEach((n) => n !== oldBar && n.remove());
      const kids = [...newPanel.childNodes], at = kids.indexOf(newBar);
      oldBar.before(...kids.slice(0, at)); oldBar.after(...kids.slice(at + 1));
      [...v.childNodes].forEach((n) => n !== oldPanel && n.remove());
      const top = [...tmp.childNodes], pi = top.indexOf(newPanel);
      oldPanel.before(...top.slice(0, pi)); oldPanel.after(...top.slice(pi + 1));
      caret = null;
    } else v.innerHTML = html;
    // Put swiped photo strips back where they were
    v.querySelectorAll(".strip").forEach((s) => { const i = state.strip[s.dataset.strip] || 0; if (i) { s.scrollLeft = i * s.clientWidth; loadSlides(s, i); } });
    if (caret !== null) { const q = document.getElementById(active); if (q) { q.focus(); try { q.setSelectionRange(caret, caret); } catch (e) {} } }
  }

  function banners() {
    let h = "";
    if (state.offline) h += `<div class="banner">Demo mode: nothing is saved yet. Fill in firebase-config.js (see the README) to keep records and sync between devices.</div>`;
    if (hasExamples()) h += `<div class="banner"><span>The entries marked <span class="chip ex">Example</span> are samples to show how things look.</span>${canEdit() ? `<button class="btn small" data-act="clear-examples" id="clear-ex">Remove examples</button>` : ""}</div>`;
    return h;
  }

  // Everything a piece can be found by: its fields, its glazes' names, colors and makers, and how they went on
  function pieceText(p) {
    return [p.name, p.artist, p.notes, p.clay, p.form, p.size, p.layering, p.glazeNotes, p.decorTech, p.tools, p.firing, p.slab,
      ...(p.techniques || []), ...(p.decor || []), ...(p.tags || []).map(tagLabel), (statusOf(p) || [])[1],
      ...(p.glazes || []).flatMap((l) => { const g = glazeById(l.glazeId); return [lineName(l), l.how, l.where, l.method, g && g.color, g && g.brand]; }),
    ].filter(Boolean).join(" ").toLowerCase();
  }

  function piecesHTML() {
    const q = state.search.trim().toLowerCase(), fg = glazeById(state.filterGlaze);
    const { filterForm: ff, filterTag: ft, filterStatus: fs_, filterArtist: fa } = state;
    const list = state.pieces
      .filter((p) => !fg || (p.glazes || []).some((l) => l.glazeId === fg.id))
      .filter((p) => !ff || (p.form || "") === ff)
      .filter((p) => !fa || (p.artist || "").trim() === fa)
      .filter((p) => !ft || (p.tags || []).includes(ft))
      .filter((p) => !fs_ || (fs_ === "finished") === !!p.date)
      .filter((p) => { if (!q) return true; const t = pieceText(p); return q.split(/\s+/).every((w) => t.includes(w)); })
      .sort(pieceSort);
    const forms = [...new Set([...FORMS.filter((f) => state.pieces.some((p) => p.form === f)), ...state.pieces.map((p) => p.form).filter(Boolean)])];
    const artists = [...new Set(state.pieces.map((p) => (p.artist || "").trim()).filter(Boolean))].sort((a, b) => a.localeCompare(b));
    const filtered = !!(fg || q || ff || ft || fs_ || fa);
    const sel = (key, all, opts) => `<select data-filter="${key}" aria-label="${esc(all)}"><option value="">${esc(all)}</option>${opts.map(([v, l]) => `<option value="${esc(v)}"${state[key] === v ? " selected" : ""}>${esc(l)}</option>`).join("")}</select>`;
    return `
      <section class="panel">
        <div class="total"><b class="num">${state.pieces.length}</b>${state.pieces.length === 1 ? "piece" : "pieces"} in all</div>
        <div class="toolbar">
          <input class="search" id="q" type="search" placeholder="Search: mug, blue, frozen pond…" value="${esc(state.search)}" aria-label="Search pieces" autocomplete="off">
        </div>
        ${state.pieces.length ? `<div class="filters">
          ${glazeList().length ? `<button type="button" class="pick-btn" data-act="filter-glaze" aria-label="Show pieces with glaze: ${esc(fg ? fg.name : "All glazes")}">
            ${fg ? glazeThumb(fg) : `<span class="gdot" aria-hidden="true">★</span>`}<span class="nm">${esc(fg ? fg.name : "All glazes")}</span></button>` : ""}
          ${artists.length ? sel("filterArtist", "All artists", artists.map((a) => [a, a])) : ""}
          ${sel("filterForm", "All forms", forms.map((f) => [f, f]))}
          ${sel("filterTag", "All marks", TAGS)}
          ${sel("filterStatus", "Any status", [["progress", "In progress"], ["finished", "Finished"]])}
        </div>` : ""}
        <div class="count num">${filtered ? `Showing ${list.length} of ${state.pieces.length} · <button class="linkbtn" data-act="clear-filters" type="button" style="padding:0">Show all</button> · ` : ""}${state.pieces.length && canEdit() ? `<button class="linkbtn" data-act="csv-pieces" type="button" style="padding:0">Download backup</button>` : ""}</div>
      </section>
      ${list.length ? `<div class="cards">${list.map(pieceCard).join("")}</div>`
        : `<section class="panel"><div class="empty">${state.pieces.length ? "No pieces match. Try another search or filter." : "No pieces yet. Tap “Add piece” to record a piece with its photos, glazes and notes."}</div></section>`}`;
  }

  function pieceCard(p) {
    const ids = piecePhotoIds(p), lines = p.glazes || [], st = statusOf(p);
    const at = Math.min(state.strip[p.id] || 0, Math.max(0, ids.length - 1));
    // Photos sit side by side in a strip she can swipe; only the cover is fetched up front, the rest as she swipes
    const slides = ids.map((id, i) => {
      const src = i === 0 ? photoSrc(id) : photoCache.get(id) || "";
      const bottom = id === p.bottomPhotoId;
      return `<button type="button" class="slide" data-zoom-piece="${esc(p.id)}" data-i="${i}" aria-label="See ${bottom ? "the bottom" : `photo ${i + 1}`} of ${esc(p.name)} bigger">${src ? `<img src="${esc(src)}" alt="">` : `<img data-pid="${esc(id)}" alt="">`}${bottom ? `<span class="tagb">Bottom</span>` : ""}</button>`;
    }).join("");
    const status = st ? (st[0] === "finished" ? dateLabel(p.date) : "") : "";
    const meta = [p.artist ? `By ${p.artist}` : "", [p.form, p.size].filter(Boolean).join(", "), status, p.clay, canEdit() ? priceRange(p) : ""].filter(Boolean);
    return `<article class="card">
      ${ids.length ? `<div class="pic"><div class="strip" data-strip="${esc(p.id)}">${slides}</div>
          ${ids.length > 1 ? `<button type="button" class="sarr l" data-sarr="-1" aria-label="Previous photo">‹</button><button type="button" class="sarr r" data-sarr="1" aria-label="Next photo">›</button><span class="more num" data-strip-n>${at + 1} / ${ids.length}</span>` : ""}</div>`
        : `<div class="pic"><div class="nopic">${POT_ICON}</div></div>`}
      <button type="button" class="body" data-piece="${esc(p.id)}" aria-label="Open ${esc(p.name)}">
        <span class="name">${esc(p.name)}</span>
        ${meta.length ? `<span class="meta">${meta.map(esc).join(" · ")}</span>` : ""}
        ${(st && st[0] !== "finished") || (p.tags || []).length || p.example ? `<span class="chips">${st && st[0] !== "finished" ? `<span class="chip prog">${esc(st[1])}</span>` : ""}${(p.tags || []).map((t) => `<span class="chip ${t === "favorite" ? "love" : t === "failed" ? "no" : ""}">${esc(tagLabel(t))}</span>`).join("")}${p.example ? `<span class="chip ex">Example</span>` : ""}</span>` : ""}
        ${lines.length ? `<span class="gchips">${lines.map((l) => `<span class="gchip">${glazeThumb(glazeById(l.glazeId), "")}<span>${esc(lineName(l))}</span></span>`).join("")}</span>` : ""}
        ${p.notes ? `<span class="notes">${esc(p.notes)}</span>` : ""}
      </button>
    </article>`;
  }

  function glazesHTML() {
    const q = state.gsearch.trim().toLowerCase(), fr = state.filterRating, ft = state.filterType;
    const list = state.glazes
      .filter((g) => !ft || typeOf(g) === ft)
      .filter((g) => !fr || (fr === "runner" ? g.runner : g.rating === fr))
      .filter((g) => { if (!q) return true; const t = [g.name, g.brand, g.color, g.notes, g.description, g.where, g.recipe, typeLabel(g.type)].filter(Boolean).join(" ").toLowerCase(); return q.split(/\s+/).every((w) => t.includes(w)); })
      .sort(glazeSort);
    const TYPE_PLURAL = { glaze: "Glazes", underglaze: "Underglazes", stain: "Stains", lowfire: "Low-fire glazes", slip: "Slips", clay: "Clay bodies" };
    const types = SUPPLY_TYPES.filter(([k]) => state.glazes.some((g) => typeOf(g) === k));
    const used = new Map();
    for (const p of state.pieces) for (const l of p.glazes || []) used.set(l.glazeId, (used.get(l.glazeId) || 0) + 1);
    return `
      <section class="panel">
        <div class="toolbar">
          <input class="search" id="gq" type="search" placeholder="Search: blue, Amaco, runs…" value="${esc(state.gsearch)}" aria-label="Search glazes and supplies" autocomplete="off">
        </div>
        ${types.length > 1 || ft ? `<div class="pills" style="margin-top:10px" role="group" aria-label="Show which kind">
          <button type="button" data-type="" aria-pressed="${!ft}">Everything</button>
          ${types.map(([k, label]) => `<button type="button" data-type="${k}" aria-pressed="${ft === k}">${esc(TYPE_PLURAL[k] || label)}</button>`).join("")}
        </div>` : ""}
        <div class="pills" style="margin-top:8px" role="group" aria-label="Show by rating">
          <button type="button" data-rating="" aria-pressed="${!fr}">Any rating</button>
          ${RATINGS.map(([k, label]) => `<button type="button" data-rating="${k}" aria-pressed="${fr === k}">${label}</button>`).join("")}
          <button type="button" data-rating="runner" aria-pressed="${fr === "runner"}">Runners</button>
        </div>
        <div class="count num">${plural(list.length, ft === "clay" ? "clay body" : "item")}${list.length !== state.glazes.length ? ` of ${state.glazes.length}` : ""}${state.glazes.length && canEdit() ? ` · <button class="linkbtn" data-act="csv-glazes" type="button" style="padding:0">Download backup</button>` : ""}</div>
      </section>
      ${list.length ? `<div class="cards glz">${list.map((g) => {
        const clay = isClay(g), n = clay ? piecesWithClay(g.name).length : used.get(g.id) || 0, src = glazePhoto(g);
        const meta = [typeOf(g) === "glaze" ? "" : typeLabel(g.type), g.brand, g.color].filter(Boolean);
        return `<article class="card">
          ${src ? `<button type="button" class="pic" data-zoom-glaze="${esc(g.id)}" aria-label="See ${esc(g.name)} bigger"><img src="${esc(src)}" alt="" loading="lazy"></button>`
            : `<div class="pic"><div class="nopic">${POT_ICON}</div></div>`}
          <button type="button" class="body" data-glaze="${esc(g.id)}" aria-label="Open ${esc(g.name)}">
            <span class="name">${esc(g.name)}</span>
            ${meta.length ? `<span class="meta">${meta.map(esc).join(" · ")}</span>` : ""}
            ${g.description || g.notes ? `<span class="notes">${esc(g.description || g.notes)}</span>` : ""}
            ${g.rating || g.runner || g.example ? `<span class="chips">${g.rating ? `<span class="chip ${g.rating}">${esc(ratingLabel(g.rating))}</span>` : ""}${g.runner ? `<span class="chip no">Runner</span>` : ""}${g.example ? `<span class="chip ex">Example</span>` : ""}</span>` : ""}
          </button>
          <div class="foot">${n ? `<button class="linkbtn" type="button" ${clay ? `data-clay-pieces="${esc(g.name)}"` : `data-glaze-pieces="${esc(g.id)}"`}>Used on ${plural(n, "piece")}</button>` : `<span class="meta">Not used yet</span>`}</div>
        </article>`;
      }).join("")}</div>`
        : `<section class="panel"><div class="empty">${state.glazes.length ? "Nothing matches." : "Nothing here yet. Tap “Add” to save a glaze, underglaze or clay body with a photo and notes."}</div></section>`}`;
  }

  // ---------- People ----------
  const ROLES = [["full", "Full access"], ["student", "Student (view only)"]];
  const canEdit = () => !fs || state.role === "full";
  // Who made a piece: anyone on the People list, plus any name already typed on a piece (people who don't use the app)
  const personName = (m) => (m.name || "").trim() || (m.email || "").split("@")[0];
  const artistNames = () => [...new Set([...state.members.map(personName), ...state.pieces.map((p) => (p.artist || "").trim())].filter(Boolean))].sort((a, b) => a.localeCompare(b));
  const myName = () => { const m = state.me && state.members.find((x) => x.id === state.me.uid); return m ? personName(m) : ""; };
  // New logins are made with a second, separate sign-in so making one doesn't sign her out
  let adderAuth = null;
  function getAdder() {
    if (!adderAuth) adderAuth = initializeAuth(initializeApp(firebaseConfig, "adder"), { persistence: inMemoryPersistence });
    return adderAuth;
  }
  const appLink = () => location.origin + location.pathname;
  const memberRef = (uid) => doc(fs, "studio", "shared", "members", uid);
  const requestRef = (uid) => doc(fs, "studio", "shared", "requests", uid);

  function refreshPeople() {
    const el = document.querySelector(".sheet.people"); if (!el) return;
    const me = state.me && state.me.uid;
    const members = state.members.slice().sort((a, b) => (a.id === me ? -1 : b.id === me ? 1 : (a.name || a.email || "").localeCompare(b.name || b.email || "")));
    el.querySelector("#pp-list").innerHTML = members.map((m) => `<div class="pp-row">
        <button type="button" class="pp-who linkish" data-rename="${esc(m.id)}" aria-label="Change the name for ${esc(m.name || m.email)}"><b>${esc(m.name || m.email)}</b><small>${m.name ? esc(m.email) + " · " : ""}Tap to ${m.name ? "change" : "add"} name</small></button>
        ${m.id === me ? `<span class="chip">You · Full access</span>`
          : `<div class="pp-acts"><select data-role="${esc(m.id)}" aria-label="Access for ${esc(m.name || m.email)}">${ROLES.map(([k, l]) => `<option value="${k}"${(m.role || "full") === k ? " selected" : ""}>${l}</option>`).join("")}</select>
             <button type="button" class="btn small danger" data-remove="${esc(m.id)}">Remove</button></div>`}
      </div>`).join("") || `<p class="hint">Loading…</p>`;
    el.querySelectorAll("[data-remove]").forEach((b) => armDelete(b, "Remove", async () => {
      try { await deleteDoc(memberRef(b.dataset.remove)); toast("Removed. They can't see the studio anymore.", "ok"); } catch (e) { console.error(e); toast("Couldn't remove them. Try again.", "err"); }
    }));
    const reqs = state.requests.slice().sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
    el.querySelector("#pp-wait").innerHTML = reqs.length ? `<div class="pp-waiting"><div class="sect-label">Waiting to get in</div>
      ${reqs.map((r) => `<div class="pp-row">
        <div class="pp-who"><b>${esc(r.email || "Someone")}</b><small>Signed in ${esc(new Date(r.createdAt || Date.now()).toLocaleDateString("en-US", { month: "short", day: "numeric" }))} and asked to get in</small></div>
        <div class="pp-acts"><button type="button" class="btn small" data-let="${esc(r.id)}" data-as="full">Full access</button><button type="button" class="btn small ghost" data-let="${esc(r.id)}" data-as="student">Student</button><button type="button" class="btn small danger" data-decline="${esc(r.id)}">No</button></div>
      </div>`).join("")}</div>` : "";
  }

  function peopleSheet() {
    if (!fs) {
      openSheet(`<h3>People</h3><p class="hint">In demo mode there's nobody to add. Once Firebase is connected, this is where people get logins: full access, or students who can look but not change anything.</p>
        <div class="actions"><div class="right"><button class="btn" type="button" id="pp-close">Close</button></div></div>`, (el) => el.querySelector("#pp-close").addEventListener("click", closeSheet));
      return;
    }
    openSheet(`
      <h3>People</h3>
      <div id="pp-wait"></div>
      <div class="sect-label">Who can sign in</div>
      <div id="pp-list" class="pp-list"></div>
      <form id="pp-add" class="pp-add" novalidate>
        <div class="sect-label">Add someone</div>
        <div class="fgrid">
          <label class="f">Name<input id="pp-name" placeholder="e.g. Sarah" ${TEXT_ATTRS} autocapitalize="words"></label>
          <label class="f">Email<input id="pp-email" type="email" inputmode="email" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="sarah@example.com"></label>
          <label class="f">Starting password<input id="pp-pass" autocomplete="new-password" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="At least 6 characters"></label>
          <div class="f"><span>Access</span>${pillSet("pp-role", ROLES, ["full"], { single: true, label: "Access" })}</div>
          <p class="hint full">Full access can add and change everything, including people. Students can look at everything but can't change anything.</p>
          <div class="full"><button class="btn" type="submit" id="pp-go">Add person</button></div>
          <div class="full" id="pp-done"></div>
        </div>
      </form>
      <div class="actions"><div class="right"><button class="btn ghost" type="button" id="pp-close">Close</button></div></div>`, (el) => {
      el.classList.add("people");
      refreshPeople();
      wireForm(el);
      el.querySelector("#pp-close").addEventListener("click", closeSheet);
      el.addEventListener("change", async (e) => {
        const s = e.target.closest("[data-role]"); if (!s) return;
        try { await updateDoc(memberRef(s.dataset.role), { role: s.value }); toast(s.value === "student" ? "Changed to student (view only)" : "Changed to full access", "ok"); }
        catch (ex) { console.error(ex); toast("Couldn't change that. Try again.", "err"); refreshPeople(); }
      });
      el.addEventListener("click", async (e) => {
        const rn = e.target.closest("[data-rename]");
        if (rn) {
          const m = state.members.find((x) => x.id === rn.dataset.rename); if (!m) return;
          const old = personName(m), name = (prompt("Name (it shows up as an artist on pieces):", m.name || "") ?? "").trim();
          if (!name || name === m.name) return;
          try {
            const b = writeBatch(fs);
            b.update(memberRef(m.id), { name });
            // Pieces already marked with their old name follow the new one
            state.pieces.filter((p) => p.artist === old).forEach((p) => b.update(doc(fs, "studio", "shared", "pieces", p.id), { artist: name }));
            await b.commit(); toast("Name saved", "ok");
          } catch (ex) { console.error(ex); toast("Couldn't change the name. Try again.", "err"); }
          return;
        }
        const let_ = e.target.closest("[data-let]"), no = e.target.closest("[data-decline]");
        if (let_) {
          const r = state.requests.find((x) => x.id === let_.dataset.let); if (!r) return;
          let_.disabled = true;
          try {
            const b = writeBatch(fs);
            b.set(memberRef(r.id), { email: r.email || "", name: "", role: let_.dataset.as, createdAt: Date.now() });
            b.delete(requestRef(r.id));
            await b.commit();
            toast(`${r.email || "They"} can get in now`, "ok");
          } catch (ex) { console.error(ex); toast("Couldn't let them in. Try again.", "err"); let_.disabled = false; }
        }
        if (no) { try { await deleteDoc(requestRef(no.dataset.decline)); toast("Request removed", "ok"); } catch (ex) { console.error(ex); toast("Couldn't remove that. Try again.", "err"); } }
        const cp = e.target.closest("[data-copy]");
        if (cp) {
          try { await navigator.clipboard.writeText(cp.dataset.copy); toast("Copied. Paste it into a text to them.", "ok"); }
          catch (ex) { toast("Couldn't copy. Write the email and password down instead.", "warn"); }
        }
      });
      el.querySelector("#pp-add").addEventListener("submit", async (e) => {
        e.preventDefault();
        const name = el.querySelector("#pp-name").value.trim(), email = el.querySelector("#pp-email").value.trim().toLowerCase(), pass = el.querySelector("#pp-pass").value;
        const role = readPills(el, "pp-role")[0] || "full";
        if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { el.querySelector("#pp-email").focus(); return toast("Type their email address.", "warn"); }
        if (pass.length < 6) { el.querySelector("#pp-pass").focus(); return toast("The password needs at least 6 characters.", "warn"); }
        const go = el.querySelector("#pp-go"); go.disabled = true; go.textContent = "Adding…";
        try {
          const adder = getAdder();
          const cred = await createUserWithEmailAndPassword(adder, email, pass);
          const uid = cred.user.uid;
          await signOut(adder);
          await setDoc(memberRef(uid), { email, name, role, createdAt: Date.now() });
          const details = `Pottery Tracker\n${appLink()}\nEmail: ${email}\nPassword: ${pass}`;
          el.querySelector("#pp-done").innerHTML = `<div class="pp-card"><b>${esc(name || email)} can sign in now${role === "student" ? " (view only)" : ""}.</b>
            <span>Send them the link, their email and this password: <b>${esc(pass)}</b></span>
            <button type="button" class="btn small" data-copy="${esc(details)}">Copy sign-in details</button></div>`;
          ["#pp-name", "#pp-email", "#pp-pass"].forEach((s) => (el.querySelector(s).value = ""));
          toast(`${name || email} added`, "ok");
        } catch (ex) {
          console.error(ex);
          const c = (ex && ex.code) || "";
          toast(c.includes("email-already-in-use") ? "That email already has a login. Have them open the app and sign in; they'll show up here under “Waiting to get in”." :
            c.includes("invalid-email") ? "That email doesn't look right." :
            c.includes("weak-password") ? "Pick a longer password." :
            c.includes("operation-not-allowed") || c.includes("admin-restricted") ? "Firebase isn't allowing new logins yet. Turn on “Enable create (sign-up)” in Firebase (see the setup guide)." :
            c.includes("network") ? "No connection. Try again when you're online." :
            c.includes("permission") ? "This account can't add people." : "Couldn't add them. Try again.", "err");
        }
        go.disabled = false; go.textContent = "Add person";
      });
    }, { big: true });
  }

  // Students see everything but can't change it: same popups, with the boxes locked and no Save
  function makeReadOnly(el) {
    el.classList.add("ro");
    el.querySelectorAll("input:not(.vh), select, textarea").forEach((x) => (x.disabled = true));
    const acts = el.querySelector(".actions");
    if (acts) { acts.innerHTML = `<div class="right"><button class="btn" type="button" data-ro-close>Close</button></div>`; acts.querySelector("[data-ro-close]").addEventListener("click", closeSheet); }
    const h = el.querySelector("h3"); if (h) h.textContent = h.textContent.replace(/^Edit (\w)/, (m, c) => c.toUpperCase());
  }

  function waitingHTML() {
    if (state.role === null) return `<section class="panel"><div class="empty">Checking your access…</div></section>`;
    return `<section class="panel">
      <h2>Almost there</h2>
      <p style="margin:0 0 10px">You're signed in as <b>${esc(state.me ? state.me.email : "")}</b>, but you haven't been let in yet.</p>

  // ---------- Sheets ----------
  function openSheet(html, onMount, { big = false, ro = false } = {}) {
    const root = document.getElementById("sheet-root");
    root.innerHTML = `<div class="overlay" id="overlay"><div class="sheet${big ? " big" : ""}" role="dialog" aria-modal="true">${html}</div></div>`;
    const ov = document.getElementById("overlay");
    ov.addEventListener("click", (e) => { if (e.target === ov) closeSheet(); });
    onMount && onMount(root.querySelector(".sheet"));
    if (ro) makeReadOnly(root.querySelector(".sheet"));
    // Only jump into the first box with a mouse and keyboard; on a phone or iPad the keyboard would cover the popup
    const first = root.querySelector("input:not(.vh), textarea"); if (first && matchMedia("(pointer: fine)").matches) first.focus();
  }
  function closeSheet() { document.getElementById("sheet-root").innerHTML = ""; }
  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape") return;
    const crop = document.querySelector(".cropper"); if (crop) { crop.querySelector("[data-c=cancel]").click(); return; }
    const v = document.querySelector(".viewer"); if (v) { v.remove(); return; }
    const picker = document.querySelector(".picker-ov");
    if (picker) picker.remove(); else closeSheet();
  });

  function armDelete(btn, label, fn) {
    btn.addEventListener("click", async () => {
      if (!btn.classList.contains("armed")) { btn.classList.add("armed"); btn.textContent = "Tap again to delete"; setTimeout(() => { btn.classList.remove("armed"); btn.textContent = label; }, 3500); return; }
      await fn();
    });
  }

  // Full-screen photo, with arrows when there are several. Tap the dark area to close.
  // onCrop(index): when given (in an edit popup), a Crop button closes the viewer and hands back which photo to crop.
  function viewPhotos(photos, start = 0, caption = "", { onCrop } = {}) {
    if (!canEdit()) onCrop = undefined;
    // Keep each photo's original position, since ones still loading ("") are left out
    const list = photos.map((src, k) => ({ src, k })).filter((x) => x.src); if (!list.length) return;
    photos = list.map((x) => x.src);
    let i = Math.max(0, list.findIndex((x) => x.k === start));
    const root = document.createElement("div");
    root.className = "viewer"; root.setAttribute("role", "dialog"); root.setAttribute("aria-modal", "true"); root.setAttribute("aria-label", caption || "Photo");
    const draw = () => {
      root.innerHTML = `<button class="btn small v-close" data-v="close">Close</button><img src="${esc(photos[i])}" alt="${esc(caption)}">
        ${caption ? `<div class="cap">${esc(caption)}</div>` : ""}
        ${photos.length > 1 || onCrop ? `<div class="bar">${photos.length > 1 ? `<button class="btn ghost small" data-v="-1" aria-label="Previous photo">‹</button><span class="num">${i + 1} / ${photos.length}</span><button class="btn ghost small" data-v="1" aria-label="Next photo">›</button>` : ""}
          ${onCrop ? `<button class="btn small v-crop" data-v="crop">Crop</button>` : ""}</div>` : ""}`;
    };
    draw();
    root.addEventListener("click", (e) => {
      const b = e.target.closest("[data-v]");
      if (!b) { if (e.target === root) root.remove(); return; }
      if (b.dataset.v === "close") return root.remove();
      if (b.dataset.v === "crop") { root.remove(); return onCrop(list[i].k); }
      i = (i + Number(b.dataset.v) + photos.length) % photos.length; draw();
    });
    document.body.appendChild(root);
    root.querySelector(".v-close").focus();
  }

  // Searchable glaze list with photos, like a full-size dropdown. onPick(id, typedName): id is a glaze id,
  // "" for All glazes (filter mode) or "new" for a glaze that isn't in the Glazes tab yet.
  function pickGlaze(currentId, onPick, { filter = false, skip = [] } = {}) {
    const glazes = glazeList().filter((g) => !skip.includes(g.id) || g.id === currentId).sort(glazeSort);
    const title = filter ? "Show pieces with" : "Choose a glaze";
    const ov = document.createElement("div");
    ov.className = "picker-ov";
    ov.innerHTML = `<div class="picker" role="dialog" aria-modal="true" aria-label="${title}">
      <div class="picker-head"><h3>${title}</h3><button type="button" class="btn ghost small" data-close>Close</button></div>
      <div class="picker-search"><input type="search" placeholder="Search ${plural(glazes.length, "glaze")}" aria-label="Search glazes" ${TEXT_ATTRS} autocapitalize="words"></div>
      <div class="picker-list"></div>
    </div>`;
    document.getElementById("sheet-root").appendChild(ov);
    const list = ov.querySelector(".picker-list"), q = ov.querySelector("input");
    const used = (g) => piecesWithGlaze(g.id).length;
    const row = (g) => `<button type="button" class="pick-row" data-id="${esc(g.id)}" aria-selected="${g.id === currentId}">${glazeThumb(g)}
      <span class="nm">${esc(g.name)}<span class="meta">${[typeOf(g) === "glaze" ? "" : typeLabel(g.type), g.brand, ratingLabel(g.rating), g.runner ? "Runner" : "", used(g) ? `on ${plural(used(g), "piece")}` : ""].filter(Boolean).map(esc).join(" · ")}</span></span></button>`;
    const allRow = () => `<button type="button" class="pick-row" data-id="" aria-selected="${!currentId}"><span class="gdot" aria-hidden="true">★</span>
      <span class="nm">All glazes<span class="meta">Show every piece</span></span></button>`;
    const newRow = (name) => `<button type="button" class="pick-row" data-id="new" data-name="${esc(name)}"><span class="gdot" aria-hidden="true">+</span>
      <span class="nm">${name ? `Add “${esc(name)}” as a new glaze` : "New glaze (not in Glazes yet)"}<span class="meta">It's added to the Glazes tab when you save the piece</span></span></button>`;
    const draw = () => {
      const typed = q.value.trim(), t = typed.toLowerCase();
      const hits = t ? glazes.filter((g) => [g.name, g.brand, g.color].some((s) => (s || "").toLowerCase().includes(t))) : glazes;
      const exact = glazeList().some((g) => (g.name || "").trim().toLowerCase() === t);
      list.innerHTML = (filter ? (typed ? "" : allRow()) : exact ? "" : newRow(typed))
        + hits.map(row).join("")
        + (hits.length ? "" : `<p class="pick-none">No glaze matches “${esc(typed)}”.</p>`);
    };
    draw();
    Promise.all(glazes.filter((g) => g.photoId && !photoCache.has(g.photoId)).map((g) => loadPhoto(g.photoId))).then((got) => { if (got.length && ov.isConnected) draw(); });
    q.addEventListener("input", draw);
    ov.addEventListener("click", (e) => {
      if (e.target === ov || e.target.closest("[data-close]")) return ov.remove();
      const b = e.target.closest(".pick-row"); if (!b) return;
      ov.remove(); onPick(b.dataset.id, b.dataset.name || "");
    });
    const cur = list.querySelector('[aria-selected="true"]'); if (cur) cur.scrollIntoView({ block: "center" });
    if (matchMedia("(pointer: fine)").matches) q.focus();
  }

  // Photo tiles in a popup. Each item is { id, src }: id is the stored photo, "" for one not saved yet.
  function photoTile(ph, i, { cover = false, label = "photo" } = {}) {
    return `<div class="ph">
      ${ph.src ? `<button type="button" class="img" data-ph-view="${i}" aria-label="See ${label} ${i + 1} bigger"><img src="${esc(ph.src)}" alt=""></button>` : `<div class="loading">Loading…</div>`}
      ${cover ? `<span class="cover">Cover</span>` : ""}
      <div class="ph-acts">
        ${i > 0 ? `<button type="button" data-ph-cover="${i}" aria-label="Make this the cover photo" title="Make cover">★</button>` : ""}
        ${ph.src ? `<button type="button" data-ph-rot="${i}" aria-label="Rotate ${label} ${i + 1} a quarter turn" title="Rotate">↻</button>` : ""}
        <button type="button" data-ph-rm="${i}" aria-label="Remove ${label} ${i + 1}" title="Remove">×</button>
      </div>
    </div>`;
  }

  // ---------- Form pieces shared by the popups ----------
  const opt = (o, val) => `<option${o === val ? " selected" : ""}>${esc(o)}</option>`;
  // A dropdown with an "Other…" choice that opens a box for typing something that isn't listed
  function choice(id, opts, val, ph, blank = "Not recorded") {
    const custom = !!val && !opts.includes(val);
    return `<select id="${id}" data-choice="${id}-other"><option value="">${blank}</option>${opts.map((o) => opt(o, val)).join("")}<option value="__other"${custom ? " selected" : ""}>Other…</option></select>
      <input id="${id}-other"${custom ? "" : " hidden"} value="${custom ? esc(val) : ""}" placeholder="${esc(ph)}" ${TEXT_ATTRS} autocapitalize="sentences" aria-label="Type your own">`;
  }
  const readChoice = (el, id) => { const v = el.querySelector("#" + id).value; return v === "__other" ? el.querySelector(`#${id}-other`).value.trim() : v; };
  // Buttons to tap on and off. opts: strings, or [value, label]. single: only one can be on (tap again to clear).
  function pillSet(id, opts, chosen, { single = false, label = "" } = {}) {
    return `<div class="pills" id="${id}" role="${single ? "radiogroup" : "group"}" aria-label="${esc(label)}"${single ? " data-single" : ""}>${opts.map((o) => {
      const [v, l] = Array.isArray(o) ? o : [o, o];
      return `<button type="button" role="${single ? "radio" : "checkbox"}" data-v="${esc(v)}" aria-checked="${chosen.includes(v)}">${esc(l)}</button>`;
    }).join("")}</div>`;
  }
  const readPills = (el, id) => [...el.querySelectorAll(`#${id} [aria-checked="true"]`)].map((b) => b.dataset.v);
  const textIn = (id, label, val, ph, { full = false, attrs = "" } = {}) =>
    `<label class="f${full ? " full" : ""}" ${attrs}>${label}<input id="${id}" value="${esc(val ?? "")}" placeholder="${esc(ph)}" ${TEXT_ATTRS} autocapitalize="sentences"></label>`;
  const numIn = (id, label, val, ph, { full = false, attrs = "", unit = "", pre = "" } = {}) =>
    `<label class="f${full ? " full" : ""}" ${attrs}>${label}<input id="${id}" inputmode="decimal" value="${esc(val ?? "")}" placeholder="${esc(ph)}" autocomplete="off" data-unit="${unit}" data-pre="${pre}"></label>`;
  // A section that starts closed; when closed it shows a one-line summary of what's filled in
  const sect = (key, title, body, { last = false } = {}) =>
    `<details class="sect" data-sect="${key}"${last ? " data-last" : ""}><summary><span class="st">${title}</span><span class="sum"></span></summary><div class="fgrid sect-body">${body}</div></details>`;
  function sectSummary(d) {
    const out = [];
    d.querySelectorAll(".sect-body input, .sect-body select, .sect-body textarea, .sect-body [aria-checked='true'], .sect-body .pick-btn .nm:not(.placeholder)").forEach((x) => {
      if (x.closest("[hidden]") || x.classList.contains("vh") || x.type === "file") return;
      if (x.matches("[aria-checked], .nm")) return out.push(x.textContent.trim());
      if (x.closest(".gline")) return; // a glaze's coats and notes; its name is enough here
      const v = (x.value || "").trim(); if (!v || v.startsWith("__")) return;
      if (x.tagName === "SELECT") return out.push(x.selectedOptions[0].textContent.trim());
      if (x.type === "date") { const lab = x.closest("label"); return out.push(`${lab ? lab.firstChild.textContent.trim() : ""} ${dateLabel(v)}`); }
      if (x.tagName === "TEXTAREA") return out.push(v.length > 50 ? v.slice(0, 50) + "…" : v);
      out.push((x.dataset.pre || "") + v + (x.dataset.unit || ""));
    });
    return (d.hasAttribute("data-last") ? out.slice(-1) : out).join(d.dataset.sect === "price" ? " – " : " · ");
  }
  // Pills, "Other…" boxes and section summaries, for any popup form
  function wireForm(el) {
    let queued = 0;
    const refresh = () => { if (queued) return; queued = requestAnimationFrame(() => { queued = 0; el.querySelectorAll("details.sect").forEach((d) => { d.querySelector(".sum").textContent = sectSummary(d); }); }); };
    el.addEventListener("click", (e) => {
      const b = !el.classList.contains("ro") && e.target.closest(".pills [data-v]");
      if (b) {
        const set = b.parentElement, on = b.getAttribute("aria-checked") !== "true";
        if (set.hasAttribute("data-single")) set.querySelectorAll("[data-v]").forEach((x) => x.setAttribute("aria-checked", "false"));
        b.setAttribute("aria-checked", String(on));
      }
      refresh();
    });
    el.addEventListener("change", (e) => {
      const s = e.target.closest("select[data-choice]");
      if (s) { const other = el.querySelector("#" + s.dataset.choice); other.hidden = s.value !== "__other"; if (!other.hidden) other.focus(); }
      refresh();
    });
    el.addEventListener("input", refresh);
    refresh();
  }
  function onePhoto(box, get, set, { label = "photo", addText = "Add photo", fileInput, caption = () => "" }) {
    const show = () => { const ph = get(); box.innerHTML = ph ? photoTile(ph, 0, { label }) : `<button type="button" class="ph-add" data-add><b>+</b>${addText}</button>`; };
    show();
    const ph0 = get();
    if (ph0 && !ph0.src) loadPhoto(ph0.id).then((src) => { const ph = get(); if (src && ph && !ph.src) { ph.src = src; show(); } });
    box.addEventListener("click", async (e) => {
      if (e.target.closest("[data-add]")) return fileInput.click();
      if (e.target.closest("[data-ph-view]")) return viewPhotos([get().src], 0, caption(), { onCrop: async () => { const out = await cropPhoto(get().src); if (out) { set({ id: "", src: out }); show(); } } });
      if (e.target.closest("[data-ph-rm]")) { set(null); return show(); }
      const rot = e.target.closest("[data-ph-rot]"); if (!rot) return;
      rot.disabled = true;
      try { set({ id: "", src: await rotatePhoto(get().src) }); } catch (ex) { console.error(ex); toast("Couldn't turn that photo.", "err"); }
      show();
    });
    fileInput.addEventListener("change", async (e) => {
      const f = e.target.files && e.target.files[0]; e.target.value = "";
      if (!f) return;
      box.innerHTML = `<div class="ph"><div class="loading">Loading…</div></div>`;
      try { const src = await addPhoto(f); if (src) set({ id: "", src }); } catch (ex) { console.error(ex); toast("Couldn't open that photo. Try a JPG or PNG.", "err"); }
      show();
    });
    return show;
  }

    // Each line is { glazeId, name, coats, method, where, how }, in the order they went on; glazeId "new" = typing a new glaze
    let lines = (p.glazes || []).map((l) => ({ ...l }));
    const clayList = clays();

            ${numIn("p-grams", "Clay used (grams)", p.clayGrams, "e.g. 450", { unit: " g" })}

            ${numIn("p-volume", "Holds (ounces)", p.volumeOz, "e.g. 12", { unit: " oz" })}`)}
          ${sect("glaze", "Glazes and decoration", `
